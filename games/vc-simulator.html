<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>风投人生</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a night-time deal table. A chunky game HUD on top; the home base is a bento of pressable rooms; each room opens full-view; year-end plays as a card-dealing cinematic. Single deliberate dark world. */
:root{
  --table:#16122B; --table-2:#1E1839; --panel:#231C42; --panel-2:#2C2452; --line:#3A3166;
  --text:#F4EFFF; --muted:#A79FC9; --ink:#1A1530;
  --cream:#FFF4DC; --cream-d:#D9C59B; --paper-line:#E9DCBE;
  --gold:#FFC23D; --gold-d:#C98B10;
  --sky:#5AB8FF; --sky-d:#2C7BC2;
  --mint:#3DDC97; --mint-d:#1E9A64;
  --coral:#FF6B5B; --coral-d:#C23D2F;
  --violet:#9B8CFF; --violet-d:#5E4FC9;
  --pink:#FF7AD0; --pink-d:#C23F92;
  --k-normal:#3DDC97; --k-ai:#5AB8FF; --k-abstract:#FF7AD0;
  --f-fx:"ZCOOL QingKe HuangYou","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Rubik","Noto Sans SC",system-ui,sans-serif;
  --f-arcade:"Bungee","Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--table);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(155,140,255,.18), transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.2px);
  background-size:auto,22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.fx{font-family:var(--f-fx);font-weight:400;letter-spacing:.02em}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.arc{font-family:var(--f-arcade);font-weight:400;letter-spacing:.01em}
.up{color:var(--mint)} .down{color:var(--coral)}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- chunky buttons ---------- */
.b3{--c:var(--gold);--cd:var(--gold-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;background:var(--c);color:var(--ink);font-weight:900;font-size:14px;box-shadow:0 5px 0 var(--cd);transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.b3:hover:not(:disabled){filter:brightness(1.07)}
.b3:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.b3:disabled{filter:grayscale(1) brightness(.6);opacity:.7}
.b3.sky{--c:var(--sky);--cd:var(--sky-d)} .b3.mint{--c:var(--mint);--cd:var(--mint-d)} .b3.coral{--c:var(--coral);--cd:var(--coral-d)}
.b3.violet{--c:var(--violet);--cd:var(--violet-d)} .b3.pink{--c:var(--pink);--cd:var(--pink-d)} .b3.cream{--c:var(--cream);--cd:var(--cream-d)}
.b3.dark{--c:var(--panel-2);--cd:#14102A;color:var(--text)}
.b3.lg{padding:15px 26px;font-size:17px;border-radius:18px;box-shadow:0 7px 0 var(--cd)}
.b3.lg:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--cd)}
.b3.sm{padding:7px 12px;font-size:12.5px;border-radius:11px;box-shadow:0 4px 0 var(--cd)}
.b3 .bolt{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-num);font-size:.85em;opacity:.85}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);padding:8px 12px 8px 8px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
.back:hover{color:var(--text);border-color:var(--violet)}

/* ---------- HUD ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--table-2)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(var(--table-2),rgba(30,24,57,.94));border-bottom:2px solid var(--line);backdrop-filter:blur(8px)}
.hud-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.crest{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.crest .seal{width:44px;height:44px;border-radius:14px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-family:var(--f-fx);font-size:24px;box-shadow:0 4px 0 var(--gold-d);flex:none}
.crest .nm{font-family:var(--f-fx);font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crest .sub{font-size:12px;color:var(--muted)}
.gauges{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:5px 12px 5px 6px;min-height:46px}
.g .ic{width:32px;height:32px;flex:none}
.g .k{font-size:10.5px;color:var(--muted);line-height:1.1;letter-spacing:.04em}
.g .v{font-family:var(--f-num);font-weight:800;font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums}
.g.tvpi .v{font-family:var(--f-arcade);font-size:20px}
.ring{position:relative;width:34px;height:34px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;font-weight:800}
.bats{display:flex;gap:3px;margin-top:3px}
.bats i{width:10px;height:16px;border-radius:3px;background:var(--panel-2);border:2px solid var(--line)}
.bats i.on{background:var(--gold);border-color:var(--gold-d);box-shadow:0 0 8px rgba(255,194,61,.5)}
.repbar{width:70px;height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.repbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:5px;transition:width .5s}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--violet)}

/* ---------- views ---------- */
.view{padding-block:22px 48px;animation:viewIn .35s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vhead h2{font-family:var(--f-fx);font-size:34px;line-height:1.1;font-weight:400}
.vhead .tip{color:var(--muted);font-size:13px;flex:1 1 260px}

/* hub */
.hub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:18px}
.tile{--c:var(--gold);--cd:var(--gold-d);position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 18px 16px;border-radius:24px;background:var(--c);color:var(--ink);overflow:hidden;
  box-shadow:0 8px 0 var(--cd),0 22px 34px -14px rgba(0,0,0,.7);transition:transform .12s,box-shadow .12s;min-width:0}
.tile:hover:not(:disabled){transform:translateY(-4px) rotate(-.3deg);box-shadow:0 12px 0 var(--cd),0 30px 40px -14px rgba(0,0,0,.75)}
.tile:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--cd),0 10px 20px -10px rgba(0,0,0,.6)}
.tile:disabled{filter:saturate(.35) brightness(.75)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0%, rgba(255,255,255,.35), transparent 45%);pointer-events:none}
.tile .tt{font-family:var(--f-fx);font-size:28px;line-height:1.05}
.tile .ts{font-size:13px;font-weight:500;opacity:.78}
.tile .art{position:absolute;right:-6px;bottom:-8px;width:120px;height:120px;opacity:.95;pointer-events:none}
.tile .big{font-family:var(--f-arcade);font-size:30px;line-height:1}
.tile .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;position:relative;z-index:1}
.tile .badge{position:absolute;top:14px;right:14px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:14px;z-index:2}
.tile .badge.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(26,21,48,.55)}60%{box-shadow:0 0 0 12px rgba(26,21,48,0)}}
.t-pitch{grid-column:span 2;grid-row:span 2;--c:var(--gold);--cd:var(--gold-d)}
.t-port{grid-column:span 2;--c:var(--sky);--cd:var(--sky-d)}
.t-market{--c:var(--mint);--cd:var(--mint-d)}
.t-inbox{--c:var(--coral);--cd:var(--coral-d)}
.t-fund{--c:var(--violet);--cd:var(--violet-d)}
.t-trophy{--c:var(--pink);--cd:var(--pink-d)}
.t-end{grid-column:span 2;--c:var(--cream);--cd:var(--cream-d)}
.t-pitch .tt{font-size:44px}
.lineup{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;position:relative;z-index:1}
.lineup .who{display:grid;justify-items:center;gap:4px;width:92px}
.lineup .who .av{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);background:var(--cream);overflow:hidden;transition:transform .2s}
.t-pitch:hover .lineup .who:nth-child(1) .av{transform:translateY(-4px) rotate(-4deg)}
.t-pitch:hover .lineup .who:nth-child(2) .av{transform:translateY(-6px)}
.t-pitch:hover .lineup .who:nth-child(3) .av{transform:translateY(-4px) rotate(4deg)}
.lineup .who b{font-size:12.5px;line-height:1.2;text-align:center}
.lineup .who small{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--gold)}
.lineup .who.gone .av{filter:grayscale(1);opacity:.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.mini-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-fx);font-size:18px;color:var(--ink);border:3px solid var(--ink)}
.t-end .tt{font-size:34px}
.clock{display:flex;gap:6px;position:relative;z-index:1}
.clock i{flex:1;height:12px;border-radius:6px;background:rgba(26,21,48,.15);border:2px solid rgba(26,21,48,.35)}
.clock i.done{background:var(--ink);border-color:var(--ink)}
.clock i.now{background:var(--gold);border-color:var(--ink);animation:blink 1.2s infinite}
@keyframes blink{50%{background:var(--coral)}}

/* panels */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.panel h3{font-family:var(--f-fx);font-size:22px;font-weight:400;margin-bottom:10px}
.cols{display:grid;gap:18px}
.pcols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.k-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.06em;padding:2px 8px;border-radius:8px;color:var(--ink)}
.k-tag.k-normal{background:var(--k-normal)} .k-tag.k-ai{background:var(--k-ai)} .k-tag.k-abstract{background:var(--k-abstract)}
.logo{display:grid;place-items:center;font-family:var(--f-fx);color:var(--ink);border:3px solid var(--ink);flex:none}
.logo.k-normal,.mini-logo.k-normal{background:var(--k-normal)} .logo.k-ai,.mini-logo.k-ai{background:var(--k-ai)} .logo.k-abstract,.mini-logo.k-abstract{background:var(--k-abstract)}
.logo.s0{border-radius:14px} .logo.s1{border-radius:50%} .logo.s2{border-radius:6px 18px 6px 18px} .logo.s3{border-radius:18px 18px 6px 18px}

/* ---------- pitch room ---------- */
.queue{display:flex;gap:10px;flex-wrap:wrap}
.qtab{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:13px}
.qtab .av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--cream);border:2px solid var(--ink)}
.qtab[aria-current="true"]{border-color:var(--gold);background:var(--panel-2);box-shadow:0 0 0 3px rgba(255,194,61,.25)}
.qtab .st{font-size:11px;color:var(--muted);font-weight:500}
.qtab.gone{opacity:.55}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.spot{position:relative;border-radius:26px;padding:22px;background:radial-gradient(ellipse 60% 55% at 50% 30%, rgba(255,194,61,.22), transparent 70%),var(--panel);border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.spot .who-top{display:flex;align-items:center;gap:12px}
.spot .who-top .logo{width:52px;height:52px;font-size:26px}
.spot .who-top h3{font-family:var(--f-fx);font-size:30px;font-weight:400;line-height:1.05}
.spot .who-top .meta{font-size:12.5px;color:var(--muted)}
.spot .who-top .k-tag{margin-left:auto;align-self:flex-start}
.founder{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:end;margin-top:auto;padding-top:18px}
.founder .av{width:150px;height:150px;border-radius:50%;border:5px solid var(--ink);background:var(--cream);overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.founder .card{display:grid;gap:2px}
.founder .card b{font-size:18px}
.founder .card span{font-size:12.5px;color:var(--muted)}
.bubble{position:relative;margin-top:18px;background:var(--cream);color:var(--ink);border-radius:20px;padding:16px 18px;font-size:16px;font-weight:500;line-height:1.6;min-height:96px;box-shadow:0 6px 0 var(--cream-d)}
.bubble::after{content:"";position:absolute;left:58px;bottom:-16px;border:10px solid transparent;border-top:12px solid var(--cream)}
.bubble .who{display:block;font-size:11.5px;font-weight:900;color:var(--gold-d);letter-spacing:.06em;margin-bottom:2px}
.bubble .caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:2px;animation:blink2 .8s steps(1) infinite}
@keyframes blink2{50%{opacity:0}}
.tagline{margin-top:12px;font-size:15px;font-weight:700}
.spot .sticker{position:absolute;top:84px;right:18px;transform:rotate(9deg);font-family:var(--f-fx);font-size:30px;padding:4px 14px;border:4px solid currentColor;border-radius:10px;background:var(--panel);animation:stamp .4s cubic-bezier(.2,1.7,.4,1) both;z-index:3}
.sticker.inv{color:var(--mint)} .sticker.pass{color:var(--muted)} .sticker.bad{color:var(--coral)}
@keyframes stamp{from{transform:rotate(9deg) scale(2.6);opacity:0}to{transform:rotate(9deg) scale(1);opacity:1}}
.xray{display:grid;gap:12px}
.mets{display:grid;gap:10px}
.met{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.met .lab{color:var(--muted);font-weight:700}
.met .val{text-align:right;font-family:var(--f-num);font-weight:800}
.track{position:relative;height:14px;border-radius:8px;background:var(--panel-2);overflow:hidden}
.track .fog{position:absolute;top:0;bottom:0;border-radius:8px;background:repeating-linear-gradient(45deg,rgba(155,140,255,.55) 0 6px,rgba(155,140,255,.25) 6px 12px);transition:left .6s,width .6s}
.track .fog.known{background:linear-gradient(90deg,var(--violet),var(--sky))}
.track .fog.sure{background:linear-gradient(90deg,var(--mint),var(--gold))}
.track .tick{position:absolute;top:0;bottom:0;width:3px;background:var(--text);transform:translateX(-50%);transition:left .6s}
.asks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ask{text-align:left;padding:10px 12px;border-radius:14px;background:var(--panel-2);border:2px solid var(--line);font-size:13px;font-weight:500;transition:border-color .15s,transform .1s}
.ask:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.ask:disabled{opacity:.4}
.ask small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.terms > div{background:var(--panel-2);border-radius:14px;padding:10px 12px}
.terms .k{font-size:11px;color:var(--muted)}
.terms .v{font-family:var(--f-num);font-weight:800;font-size:18px}
.flames{display:flex;gap:2px;padding-top:4px}
.flames svg{width:18px;height:20px}
.flags{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.flags li{font-size:13px;font-weight:500;padding:8px 12px;border-radius:12px;display:flex;gap:8px;align-items:flex-start;animation:viewIn .35s both}
.flags li b{flex:none;font-size:11px;font-weight:900;padding:1px 6px;border-radius:6px;color:var(--ink)}
.flags .g{background:rgba(61,220,151,.14)} .flags .g b{background:var(--mint)}
.flags .r{background:rgba(255,107,91,.14)} .flags .r b{background:var(--coral)}
.flags .x{background:rgba(255,107,91,.28);outline:2px solid var(--coral)} .flags .x b{background:var(--coral)}
.actbar{display:flex;gap:10px;flex-wrap:wrap}
.actbar .b3{flex:1 1 auto}
.warn{font-size:12.5px;color:var(--gold);font-weight:500}
.empty{border:2px dashed var(--line);border-radius:22px;padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{font-family:var(--f-fx);font-size:26px;color:var(--text);font-weight:400}

/* ---------- portfolio ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{position:relative;text-align:left;border-radius:20px;padding:14px;background:var(--panel);border:2px solid var(--line);display:grid;gap:10px;transition:transform .12s,border-color .15s;min-width:0}
.pcard:hover{transform:translateY(-3px);border-color:var(--violet)}
.pcard[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.22)}
.pcard .top{display:flex;gap:10px;align-items:center;min-width:0}
.pcard .top .logo{width:40px;height:40px;font-size:20px}
.pcard .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub{font-size:11.5px;color:var(--muted)}
.pcard .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.pcard .val{font-family:var(--f-num);font-weight:800;font-size:18px}
.pcard .mul{font-family:var(--f-arcade);font-size:15px}
.pcard.closed{opacity:.6}
.ladder{display:flex;gap:3px}
.ladder i{flex:1;height:6px;border-radius:3px;background:var(--panel-2)}
.ladder i.on{background:var(--gold)}
.ladder i.end{background:var(--mint)}
.ladder.dead i.on{background:var(--coral)}
.spark{width:100%;height:36px;display:block}
.stat-chip{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:7px;color:var(--ink)}
.stat-chip.ipo,.stat-chip.acq{background:var(--mint)} .stat-chip.dead,.stat-chip.fraud{background:var(--coral)} .stat-chip.alive{background:var(--panel-2);color:var(--muted)}
.pdetail{display:grid;gap:14px;position:sticky;top:100px}
.pdetail .head{display:flex;gap:12px;align-items:center}
.pdetail .head .logo{width:60px;height:60px;font-size:30px}
.pdetail .head h3{font-family:var(--f-fx);font-size:30px;font-weight:400;margin:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv > div{background:var(--panel-2);border-radius:14px;padding:10px 12px}
.kv .k{font-size:11px;color:var(--muted)}
.kv .v{font-family:var(--f-num);font-weight:800;font-size:18px}
.boosts{display:grid;gap:8px}
.boost{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:14px;background:var(--panel-2);border:2px solid var(--line);transition:border-color .15s}
.boost:hover:not(:disabled){border-color:var(--mint)}
.boost:disabled{opacity:.45}
.boost .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--ink)}
.boost b{display:block;font-size:13.5px}
.boost small{color:var(--muted);font-size:12px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:200px;overflow:auto}
.timeline li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:12.5px}
.timeline .y{font-family:var(--f-num);color:var(--muted);font-weight:700}

/* ---------- market ---------- */
.mgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.gauge{width:100%;max-width:420px;display:block;margin:0 auto}
.gauge .needle{transition:transform 1s cubic-bezier(.3,1.6,.5,1);transform-origin:200px 200px}
.gauge text{font-family:var(--f-fx);font-size:22px;fill:var(--text)}
.thermo{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:end}
.thermo .tube{position:relative;width:56px;height:220px;border-radius:28px;background:var(--panel-2);border:3px solid var(--line);overflow:hidden}
.thermo .tube i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--sky),var(--pink));transition:height 1s}
.thermo .tube.crashed i{background:linear-gradient(0deg,var(--coral),var(--gold))}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:420px;overflow:auto}
.news li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;font-size:13.5px;padding:10px 12px;border-radius:14px;background:var(--panel-2)}
.news .y{font-family:var(--f-num);font-weight:800;color:var(--gold)}

/* ---------- inbox ---------- */
.mail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.mlist{display:grid;gap:8px}
.mitem{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);border:2px solid var(--line);position:relative}
.mitem[aria-current="true"]{border-color:var(--gold)}
.mitem .av{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--cream);border:2px solid var(--ink)}
.mitem b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem small{font-size:11.5px;color:var(--muted)}
.mitem.todo::after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--panel)}
.mitem.done{opacity:.6}
.letter{background:var(--cream);color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 8px 0 var(--cream-d);display:grid;gap:14px;background-image:repeating-linear-gradient(transparent 0 31px,var(--paper-line) 31px 32px);animation:viewIn .3s both}
.letter .from{display:flex;gap:12px;align-items:center}
.letter .from .av{width:56px;height:56px;border-radius:50%;overflow:hidden;border:3px solid var(--ink);background:var(--cream)}
.letter h3{font-family:var(--f-fx);font-size:28px;font-weight:400;line-height:1.15}
.letter p{font-size:15px;line-height:1.75}
.letter .meta{font-size:12px;color:#6E6284}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{opacity:.45}
.opt b{display:block;font-size:14.5px}
.opt small{font-size:12.5px;color:#6E6284}
.resolved{font-weight:900;color:var(--mint-d);font-size:14px;padding:10px 14px;border-radius:12px;background:rgba(61,220,151,.18)}

/* ---------- trophy / fund ---------- */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.medal{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--panel);border:2px solid var(--line)}
.medal .m{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--gold);border:3px solid var(--ink);box-shadow:0 4px 0 var(--gold-d);font-family:var(--f-fx);font-size:24px;color:var(--ink)}
.medal.off{opacity:.45}
.medal.off .m{background:var(--panel-2);color:var(--muted);box-shadow:none;border-color:var(--line)}
.medal b{display:block;font-size:14px}
.medal small{font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--panel-2)}
.lrow .logo{width:42px;height:42px;font-size:20px}
.lrow b{display:block}
.lrow small{color:var(--muted);font-size:12px}
.lrow .r{text-align:right;font-family:var(--f-num);font-weight:800}
.list{display:grid;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.alloc{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--panel-2);border:2px solid var(--line)}
.alloc i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:340px;overflow:auto}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:13px}
.log .y{font-family:var(--f-num);color:var(--muted);font-weight:700}


/* pitch conversation */
.slides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.slide{position:relative;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:10px 10px 12px;min-width:0}
.slide .sn{position:absolute;top:8px;right:10px;font-family:var(--f-num);font-size:11px;font-weight:800;color:var(--muted)}
.slide b{display:block;font-family:var(--f-fx);font-weight:400;font-size:18px;color:var(--gold)}
.slide p{font-size:12.5px;line-height:1.5;margin-top:2px}
.talkhead{display:flex;align-items:center;gap:12px;margin-top:16px}
.talkhead .av{width:60px;height:60px;border-radius:50%;overflow:hidden;border:4px solid var(--ink);background:var(--cream);flex:none;animation:bob 3.2s ease-in-out infinite}
.talkhead b{display:block;font-size:16px}
.talkhead span{display:block;font-size:12px;color:var(--muted)}
.aichip{margin-left:auto;flex:none;font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:var(--panel-2);border:2px solid var(--line);color:var(--muted)}
.aichip.deepseek,.aichip.claude{border-color:var(--sky);color:var(--sky)}
.aichip:hover{border-color:var(--gold);color:var(--gold)}
.aibtn{font-family:var(--f-arcade);font-size:13px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:360px;min-height:120px;overflow-y:auto;padding:4px 2px 8px;overscroll-behavior:contain}
.msg{max-width:90%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.65;animation:viewIn .3s both;word-break:break-word}
.msg.f{align-self:flex-start;background:var(--cream);color:var(--ink);border-bottom-left-radius:5px;box-shadow:0 4px 0 var(--cream-d)}
.msg.me{align-self:flex-end;background:var(--violet);color:var(--ink);border-bottom-right-radius:5px;font-weight:500;box-shadow:0 4px 0 var(--violet-d)}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.msg .hint{display:block;margin-top:6px;font-style:normal;font-size:11px;font-weight:900;color:var(--violet-d)}
.dots{display:inline-flex;gap:4px;align-items:center;height:1em}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.askform{display:flex;gap:8px;margin-top:12px}
.qbox{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);color:var(--text)}
.qbox:focus{outline:none;border-color:var(--gold)}
.qbox:disabled{opacity:.55}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qchip{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--panel-2);border:2px solid var(--line);color:var(--muted)}
.qchip:hover:not(:disabled){border-color:var(--gold);color:var(--text)}
.qchip:disabled{opacity:.4}
.radios{display:grid;gap:8px}
.radio{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--paper-line);cursor:pointer}
.radio:has(input:checked){border-color:var(--violet-d)}
.radio input{margin-top:3px;accent-color:var(--violet-d)}
.radio b{display:block;font-size:14px}
.radio small{font-size:12px;color:#6E6284}
.ts-doc .field{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:2px solid var(--paper-line);background:#fff;color:var(--ink)}
.ts-doc .lab{font-weight:700}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,7,24,.78);backdrop-filter:blur(6px);display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ts-doc{width:min(560px,100%);background:var(--cream);color:var(--ink);border-radius:20px;padding:26px;box-shadow:0 10px 0 var(--cream-d),0 40px 80px -20px rgba(0,0,0,.8);display:grid;gap:16px;animation:pop .35s cubic-bezier(.2,1.3,.4,1) both;position:relative}
@keyframes pop{from{transform:translateY(30px) rotate(-2deg) scale(.95);opacity:0}to{transform:none;opacity:1}}
.ts-doc .eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;color:#6E6284}
.ts-doc h3{font-family:var(--f-fx);font-size:32px;font-weight:400;line-height:1.1}
.ts-doc hr{border:0;border-top:2px dashed var(--paper-line);margin:0}
.ts-row{display:grid;gap:6px}
.ts-row .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.ts-row .lab b{font-family:var(--f-arcade);font-size:22px;font-weight:400}
.ts-row small{color:#6E6284;font-size:12px}
.ts-doc input[type=range]{width:100%;accent-color:var(--violet-d);height:28px}
.mood{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:3px solid var(--ink)}
.mood .av{width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid var(--ink)}
.mood .bar{height:12px;border-radius:6px;background:#EEE3CB;overflow:hidden;margin-top:6px}
.mood .bar i{display:block;height:100%;border-radius:6px;transition:width .25s,background .25s}
.mood p{font-size:13.5px;font-weight:500}
.ts-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ts-stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--f-fx);font-size:64px;color:var(--coral);border:6px solid currentColor;border-radius:14px;padding:4px 22px;background:rgba(255,244,220,.85);animation:bigstamp .45s cubic-bezier(.2,1.7,.4,1) both;pointer-events:none}
.ts-stamp.ok{color:var(--mint-d)}
@keyframes bigstamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}

/* cinematic */
.cine{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse 70% 50% at 50% 20%, rgba(155,140,255,.25), transparent 70%),#0E0A20;overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cine-in{max-width:1100px;margin:0 auto;display:grid;gap:22px}
.cine-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.yearflip{text-align:center;display:grid;gap:6px;padding-top:6px}
.yearflip .lbl{font-family:var(--f-fx);font-size:26px;color:var(--gold)}
.yearflip .yr{font-family:var(--f-arcade);font-size:clamp(64px,13vw,128px);line-height:1;animation:yr .7s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 6px 0 var(--violet-d)}
@keyframes yr{from{transform:scale(.4) rotateX(80deg);opacity:0}to{transform:none;opacity:1}}
.headlines{display:grid;gap:8px;max-width:760px;margin:0 auto;width:100%}
.headlines div{padding:10px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:15px;font-weight:500;animation:slideIn .4s both}
.headlines div b{color:var(--gold);margin-right:8px}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.deal-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;perspective:1200px}
.rcard{position:relative;height:220px;transform-style:preserve-3d;animation:deal .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes deal{from{transform:translateY(-60px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.rcard .face,.rcard .backside{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.rcard .backside{background:repeating-linear-gradient(45deg,var(--violet-d) 0 12px,var(--violet) 12px 24px);border:4px solid var(--cream);display:grid;place-items:center;font-family:var(--f-fx);font-size:40px;color:var(--cream)}
.rcard .face{transform:rotateY(180deg);background:var(--cream);color:var(--ink);border:4px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.rcard.flip .face{transform:rotateY(0)}
.rcard.flip .backside{transform:rotateY(-180deg)}
.rcard .face .top{display:flex;gap:10px;align-items:center}
.rcard .face .top .logo{width:40px;height:40px;font-size:20px}
.rcard .face .top b{font-size:15px;line-height:1.2}
.rcard .face .top small{display:block;font-size:11px;color:#6E6284}
.rcard .face p{font-size:13px;line-height:1.5;flex:1}
.rcard .face .delta{font-family:var(--f-num);font-weight:800;font-size:15px}
.rcard .face .delta.up{color:var(--mint-d)} .rcard .face .delta.down{color:var(--coral-d)}
.rcard .rstamp{position:absolute;right:12px;bottom:12px;font-family:var(--f-fx);font-size:26px;padding:0 10px;border:4px solid currentColor;border-radius:8px;transform:rotate(10deg);background:var(--cream)}
.rcard.flip .rstamp{animation:stamp .4s .35s cubic-bezier(.2,1.7,.4,1) both}
.rstamp.good{color:var(--mint-d)} .rstamp.bad{color:var(--coral-d)} .rstamp.meh{color:#8A7FA6} .rstamp.wow{color:var(--gold-d)}
.rcard.miss .face{background:#2A1C34;color:var(--text);border-color:var(--coral)}
.rcard.miss .face small{color:var(--muted)}
.cine-sum{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;padding:18px;border-radius:22px;background:var(--panel);border:2px solid var(--line);animation:viewIn .4s both}
.cine-sum .big{font-family:var(--f-arcade);font-size:clamp(36px,7vw,58px);line-height:1}
.cine-sum .lbl{font-size:12px;color:var(--muted)}
.sec-t{font-family:var(--f-fx);font-size:24px;color:var(--gold);margin-top:6px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}

/* start & final */
.title-screen{min-height:100%;display:grid;place-items:center;padding-block:40px;position:relative;overflow:hidden}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters span{position:absolute;bottom:-80px;font-family:var(--f-arcade);color:var(--gold);opacity:.35;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(360deg)}}
.ts-wrap{position:relative;z-index:1;display:grid;gap:26px;justify-items:center;text-align:center;width:100%}
.logo-big{font-family:var(--f-fx);font-size:clamp(72px,15vw,168px);line-height:.95;color:var(--gold);text-shadow:0 8px 0 var(--gold-d),0 20px 40px rgba(0,0,0,.6);animation:yr .8s cubic-bezier(.2,1.5,.4,1) both}
.logo-big small{display:block;font-family:var(--f-arcade);font-size:clamp(14px,2.4vw,22px);color:var(--text);text-shadow:none;letter-spacing:.3em;margin-top:14px}
.ts-lede{max-width:620px;color:var(--muted);font-size:16px}
.personas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:1040px}
.pcard2{--c:var(--gold);--cd:var(--gold-d);text-align:left;border-radius:22px;padding:14px;background:var(--panel);border:3px solid var(--line);display:grid;gap:8px;transition:transform .12s,border-color .15s;justify-items:start}
.pcard2:hover{transform:translateY(-4px)}
.pcard2[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 8px 0 var(--cd)}
.pcard2 .av{width:76px;height:76px;border-radius:50%;overflow:hidden;border:4px solid var(--ink);background:var(--c)}
.pcard2 b{font-family:var(--f-fx);font-size:22px;font-weight:400}
.pcard2 small{color:var(--muted);font-size:12.5px;line-height:1.5}
.pcard2 .perk{font-size:11.5px;font-weight:900;padding:3px 8px;border-radius:8px;background:var(--c);color:var(--ink)}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-family:var(--f-fx);font-size:24px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--panel);color:var(--text);width:min(300px,80vw);text-align:center}
.namebox input:focus{outline:none;border-color:var(--gold)}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:1040px;text-align:left}
.howto div{padding:12px 14px;border-radius:16px;background:rgba(35,28,66,.7);border:2px solid var(--line)}
.howto b{display:block;font-family:var(--f-fx);font-size:19px;font-weight:400;color:var(--gold)}
.howto span{font-size:12.5px;color:var(--muted)}
.final{display:grid;gap:18px}
.final-hero{text-align:center;display:grid;gap:8px;padding:20px;border-radius:26px;background:radial-gradient(ellipse at 50% 0%, rgba(255,194,61,.25), transparent 70%),var(--panel);border:2px solid var(--line)}
.final-hero .big{font-family:var(--f-arcade);font-size:clamp(64px,14vw,130px);line-height:1}
.final-hero .rank{font-family:var(--f-fx);font-size:clamp(34px,7vw,60px);color:var(--gold);line-height:1.1}
.final-hero p{color:var(--muted);font-size:15px}
.fstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fstats > div{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px}
.fstats .k{font-size:11.5px;color:var(--muted)}
.fstats .v{font-family:var(--f-num);font-weight:800;font-size:20px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{padding:12px 16px;border-radius:16px;font-size:14px;font-weight:700;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);animation:pop .3s both}
.toast.good{background:var(--mint)} .toast.bad{background:var(--coral)} .toast.gold{background:var(--gold)}

function kindPrice(g,k){ return k==='ai' ? g.market.aiHype : k==='abstract' ? rnd(.6,1.4) : 1; }
function cycleMult(c){ return {bull:1.25, flat:1, bear:.78}[c]; }

function stats(g){
  let nav = 0, cost = 0;
  g.port.forEach(c => { cost += c.cost; if (c.status==='alive') nav += c.own*c.val; });
  const total = g.dist + nav + g.cash;
  return {nav, cost, total, tvpi: total/g.fundSize, dpi: g.dist/g.fundSize};
}

function makeFlags(g,d){
  const p = PERSONAS[g.persona];
  const n = 2 + (p.ddExtra||0);
  const out = [];
  if (d.fraud && R()<.8) out.push({c:'x', t:pick(FLAGS.fraud)});
  const pp = clamp(d.q*1.15 - .05, .1, .9);
  const used = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 30){
    const good = R() < pp;
    let pool = good ? FLAGS.pos.slice() : FLAGS.neg.slice();
    if (d.k==='ai') pool = pool.concat(good ? FLAGS.aiPos : FLAGS.aiNeg);
    if (d.k==='abstract') pool = pool.concat(good ? FLAGS.abPos : FLAGS.abNeg);
    const t = pick(pool);
    if (used.has(t)) continue;
    used.add(t); out.push({c: good?'g':'r', t});
  }
  return out;
}
function payout(c, E){ return Math.max(c.own*E, Math.min(c.cost, E*.5)); }

function marketStep(g){
  const m = g.market, news = [];
  const T = {flat:[['bull',.3],['bear',.22]], bull:[['bear',.28],['flat',.22]], bear:[['flat',.45],['bull',.12]]};
  const r = R(); let acc = 0, nc = m.cycle;
  for (const [s,pp] of T[m.cycle]){ acc += pp; if (r < acc){ nc = s; break; } }
  m.cycle = nc; news.push(pick(CYCLE_NEWS[nc]));
  let crashed = false;
  if (!m.aiCrashed){
    if (g.year >= 2 && R() < .04 + .06*g.year){ m.aiCrashed = true; m.crashYear = g.year; m.aiHype = .75; crashed = true; news.push('AI 泡沫破裂：头部模型公司裁员过半，“套壳”项目成批倒下'); }
    else { m.aiHype = r2(Math.min(3.2, m.aiHype + rnd(.08,.35))); news.push(pick(AI_NEWS)); }
  } else { m.aiHype = r2(Math.min(1.35, m.aiHype + .12)); news.push('AI 行业逐步回暖，活下来的公司开始真正赚钱'); }
  return {news, crashed};
}

function genDeal(g){
  const p = PERSONAS[g.persona];
  const pool = TPL.filter(t => !g.used.includes(t.n));
  let tot = 0;
  const w = pool.map(t => { let x = 1; if (p.bias && p.bias[t.k]) x *= p.bias[t.k]; if (t.k==='ai') x *= .6 + g.market.aiHype*.3; tot += x; return x; });
  let rr = R()*tot, t = pool[pool.length-1];
  for (let i=0;i<pool.length;i++){ rr -= w[i]; if (rr<=0){ t = pool[i]; break; } }
  g.used.push(t.n);
  const q = clamp(t.m + gauss()*(t.k==='abstract'?.12:.14) + (g.rep-50)/700, .03, .97);
  const sr = R(), stage = sr<.4 ? 0 : sr<.75 ? 1 : 2;
  const base = [[2.5,7],[8,20],[25,60]][stage];
  const heat = clamp(1 + (q>.58?1:0) + (R()<.3?1:0) + (t.k==='ai' && !g.market.aiCrashed && g.market.aiHype>1.7?1:0), 1, 3);
  const pre = rnd(base[0],base[1]) * kindPrice(g,t.k) * (1+.18*(heat-1)) * cycleMult(g.market.cycle);
  const ask = pre * rnd(.15,.25);
  const fraud = R() < ({normal:.05, ai:.1, abstract:.12}[t.k] + (q<.35?.06:0));
  const tru = {}, est = {};
  Object.keys(METRICS).forEach(k => {
    tru[k] = clamp(1 + 4*(q + gauss()*.13), .5, 5);
    est[k] = clamp(tru[k] + gauss()*.85 + (fraud && k==='traction' ? 1.2 : 0), .5, 5);
  });
  // founder's walk-away price, as a share of the asked pre-money
  const res = clamp(.74 + .07*heat + rnd(-.05,.08) - (g.rep-50)/500 - (t.k==='ai' && p.aiNego ? .05 : 0), .62, 1.02);
  return {id:g.nid++, k:t.k, name:t.n, tag:t.t, founder:t.f, bio:t.b, quote:t.q, sector:t.s,
    stage, pre:r2(pre), ask:r2(ask), q, sigma:KIND[t.k].sigma, fraud, heat, tru, est, known:{},
    dd:false, flags:[], state:'open', lead:pick(LEADS), shape:Math.floor(R()*4), seed:Math.floor(R()*1e6),
    res, patience:3, qLeft:3, mood:'neutral', floor:null, claim:est.traction, chat:[], pitch:null};
}

function floorPre(d){ return d.floor ?? d.pre*d.res; }
function makeOffer(g,d,offerPre){
  const f = floorPre(d);
  if (offerPre >= f - 1e-9){ d.mood='smile'; return {accept:true, pre:r2(offerPre)}; }
  const gap = offerPre / f;
  d.patience -= gap >= .88 ? 1 : 2;
  if (d.patience <= 0){ d.state='walked'; d.mood='angry'; addLog(g, `砍价太狠，${d.name} 的创始人拂袖而去`); return {walked:true}; }
  d.floor = r2(f * (gap >= .88 ? rnd(.99,1.02) : rnd(1.02,1.08)));
  d.mood = gap >= .88 ? 'neutral' : 'angry';
  return {counter:true, floor:d.floor};
}
function invest(g,d,amt,pre){
  amt = r2(clamp(amt, minCheck(g,d), Math.min(maxCheck(g,d), g.cash)));
  if (amt <= 0 || amt > g.cash + 1e-9) return null;
  d.pre = r2(pre);
  const post = d.pre + d.ask;
  g.cash = r2(g.cash - amt);
  const c = Object.assign({}, d, {own:amt/post, cost:amt, entry:post, val:post, status:'alive', invYear:g.year, help:0, age:0, proceeds:0, exitVal:0, last:'new',
    hist:[{y:g.startYear+g.year-1, val:post, t:'new', txt:`${g.fund} 以投后 ${r2(post)}M 投资 $${amt}M`}]});
  delete c.est;
  g.port.push(c);
  d.state = 'invested'; d.mood='smile';
  g.rep = clamp(g.rep + 1, 0, 100);
  addLog(g, `投资 ${d.name} $${amt}M，持股 ${(c.own*100).toFixed(1)}%`);
  return c;
}

function stepCompany(g, c, crashed, mine){
  if (c.status !== 'alive') return null;
  const m = g.market, p = PERSONAS[g.persona];
  const ev = {id:c.id, name:c.name, k:c.k, shape:c.shape, before:c.val, ownBefore:c.own, stageBefore:c.stage, type:'', text:'', raise:null, pay:0};
  c.age++;
  const done = () => { ev.after = c.val; ev.status = c.status; ev.stage = c.stage; ev.ownAfter = c.own; c.last = ev.type;
    if (c.hist) c.hist.push({y:g.startYear+g.year-1, val:c.val || c.exitVal || 0, t:ev.type, txt:ev.text}); return ev; };
  if (c.fraud && R() < .38){
    c.status='fraud'; c.val=0; ev.type='fraud';
    ev.text = pick(['被曝虚构八成收入，创始人已失联','审计发现“头部客户”是创始人表弟的公司','账上资金被挪去炒币，全部归零']);
    if (mine) g.rep = clamp(g.rep-6,0,100);
    return done();
  }
  if (crashed && c.k==='ai') c.val *= rnd(.35,.6);
  if (c.k==='abstract' && R() < .025*(p.moon||1)*(m.cycle==='bull'?1.4:1)){
    c.val *= rnd(4,12); c.stage = Math.min(5, c.stage+2); c.q = Math.min(.9, c.q+.25);
    ev.type='moon'; ev.text = pick(['在海外社交媒体意外爆火，一周涨粉 2000 万','被顶流明星直播带货，订单排到明年','成为年度现象级网络梗，估值一夜暴涨']);
    if (mine) g.rep = clamp(g.rep+4,0,100);
    return done();
  }
  const mk = {bull:.07, flat:0, bear:-.08}[m.cycle];
  const ai = c.k==='ai' ? (m.aiCrashed ? (crashed ? -.15 : -.03) : (m.aiHype-1.6)*.1) : 0;
  const r = c.q + gauss()*c.sigma + mk + ai + c.help*.07 + (c.bridge?.08:0) - (c.bridgeDenied?.15:0);
  c.help = 0; c.bridge = false; c.bridgeDenied = false;
  const exit = (status, mult, text) => {
    c.status = status; c.exitVal = c.val*mult; ev.type = status; ev.text = text;
    if (mine){ ev.pay = payout(c,c.exitVal); c.proceeds += ev.pay; g.dist += ev.pay; g.rep = clamp(g.rep + (ev.pay>c.cost ? (status==='ipo'?6:3) : 0),0,100); }
    c.val = 0; return done();
  };
  if (c.stage>=4 && r>.5 && R() < .5 + (c.age>=5?.2:0)){
    if (r>.64 && m.cycle!=='bear') return exit('ipo', rnd(1.3,3)*(m.cycle==='bull'?1.25:1), `在${pick(BOARDS)}敲钟上市，首日上涨 ${Math.round(rnd(20,160))}%`);
    return exit('acq', rnd(.8,1.6), `被${pick(BUYERS)}全资收购`);
  }
  if (c.stage>=2 && r>.38 && r<.62 && R()<.07) return exit('acq', rnd(.6,1.3), `被${pick(BUYERS)}战略收购`);
  if (r < .26 || (r < .36 && c.stage <= 1 && R() < .5)){
    c.status='dead'; c.val=0; ev.type='dead';
    ev.text = c.k==='ai' ? pick(['被基础模型的一次更新直接取代','烧光了算力预算，宣布解散','核心团队集体跳槽去了大厂'])
            : c.k==='abstract' ? pick(['热度退去，库存堆满了创始人老家的院子','创始人宣布“回归初心”，公司注销','被监管约谈后火速关停'])
            : pick(['现金流断裂，宣布解散','团队解散，创始人去考公了','被巨头补贴战打穿，黯然离场']);
    if (mine) g.rep = clamp(g.rep-2,0,100);
    return done();
  }
  if (r < .42){ c.val *= rnd(.45,.8); c.own *= .9; ev.type='down'; ev.text = pick(['以折价完成过桥融资，估值下调','业绩不及预期，被迫降价融资','裁员三分之一，勉强续命']); return done(); }
  if (r < .62){ c.val *= rnd(.85,1.15); ev.type='flat'; ev.text = pick(['稳步经营，暂未开启新一轮','收入稳步增长，但还没到融资节点','在细分市场站稳了脚跟']); return done(); }
  const mult = clamp(1.25 + (r-.62)*5 + rnd(-.2,.45), 1.2, 4.5);
  const pre = c.val*mult, amt = pre*rnd(.15,.25), dil = pre/(pre+amt);
  c.val = pre + amt; c.stage = Math.min(5, c.stage+1);
  ev.type='up'; ev.text=`完成${STAGES[c.stage]}融资，${pick(LEADS)}领投，估值涨 ${mult.toFixed(1)} 倍`;
  ev.raise = {amt:r2(amt), cost:r2(c.own*amt), ownBefore:c.own, ownAfter:c.own*dil};
  c.own *= dil;
  if (mine) g.rep = clamp(g.rep+1,0,100);
  return done();
}

    }
    missed.forEach(x => g.inbox.unshift({id:g.nid++, type:'note', y:ny, done:false, from:'行业八卦群', title:`你 Pass 掉的 ${x.name} 发达了`, body:`还记得 ${yearLabelOf(g,x.passYear)} 年那个被你 Pass 掉的 ${x.name} 吗？当时投后才 $${r2(x.entry)}M，现在已经是 $${r2(x.v)}M 了。群里有人 @ 了你。`}));
  }

function yearLabelOf(g,y){ return g.startYear + y - 1; }

function resolveMsg(g,m,i){
  if (m.done) return null;

  if (m.type==='follow'){
    const c = g.port.find(x => x.id===m.cid);

    } else { m.done = true; m.result = `放弃跟投，持股稀释到 ${(m.ownAfter*100).toFixed(1)}%`; }

  }

  const txt = EVENTS[m.ev.type].apply(g, m.ev, i);

}

  if (from === to || reduced()){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 800;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = fmt(from + (to-from)*e); if (k<1) requestAnimationFrame(step); };

}

  if (ui.view==='pitch') render();
  const out = await runAI(personaPrompt(d) + '\n\n' + PITCH_FMT, [{role:'user', content:'请开始你的路演。'}]);
  AI.busy.delete('p'+d.id);
  let pitch = offlinePitch(d), src = 'offline';
  if (out && out.res && out.res.opening){ pitch = {opening:String(out.res.opening), slides: Array.isArray(out.res.slides) && out.res.slides.length ? out.res.slides.slice(0,4).map(s => ({t:String(s.t||''), b:String(s.b||'')})) : pitch.slides}; src = out.p; }
  d.pitch = pitch; d.pitchSrc = src;
  const i = d.chat.findIndex(m => m.open); if (i >= 0) d.chat[i] = {r:'f', t:pitch.opening, open:true};
  save(); if (ui.view==='pitch') render();
}
async function askFounder(d, text){
  text = String(text || '').trim().slice(0, 200);
  if (!text || d.qLeft < 1 || d.state!=='open' || AI.busy.has('q'+d.id)) return;
  d.qLeft--;
  const prior = chatTurns(d);
  d.chat.push({r:'me', t:text}, {r:'f', t:'', pending:true});
  AI.busy.add('q'+d.id); render(); scrollChat();
  const out = await runAI(personaPrompt(d) + '\n\n' + ANSWER_FMT, [...prior, {role:'user', content:text}]);
  let res = out && out.res && out.res.reply ? out.res : offlineAnswer(d, text);
  const topic = ['team','market','product','traction'].includes(res.topic) ? res.topic : topicOf(text);
  revealTopic(d, topic);
  d.mood = ['smile','neutral','sweat','angry'].includes(res.mood) ? res.mood : 'neutral';
  const i = d.chat.findIndex(m => m.pending && !m.open);
  if (i >= 0) d.chat[i] = {r:'f', t:String(res.reply), topic};
  AI.busy.delete('q'+d.id);
  sfx('talk'); save(); render(); scrollChat();
}

function spark(hist, w=200, h=36){
  const v = hist.map(x => x.val);
  if (v.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="#3A3166" stroke-dasharray="3 4"/></svg>`;
  const mx = Math.max(...v), mn = Math.min(...v, 0);
  const x = i => 4 + i*(w-8)/(v.length-1), y = val => h-4 - (val-mn)/((mx-mn)||1)*(h-8);
  const pts = v.map((val,i) => `${x(i)},${y(val)}`).join(' ');
  const last = v[v.length-1], col = last >= v[0] ? '#3DDC97' : '#FF6B5B';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- fund & trophy ---------- */
function chart(hist){
  const W = 560, H = 200, pl = 38, pr = 14, pt = 14, pb = 26;
  const maxY = Math.max(2, ...hist.map(h => h.tvpi)) * 1.1;
  const x = i => pl + i*(W-pl-pr)/Math.max(1, G.maxYear);
  const y = v => pt + (1 - v/maxY)*(H-pt-pb);
  const pts = hist.map((h,i) => `${x(i)},${y(h.tvpi)}`).join(' ');
  const area = `${x(0)},${y(0)} ${pts} ${x(hist.length-1)},${y(0)}`;
  const ticks = [...new Set([0, 1, Math.round(maxY/2), Math.floor(maxY)])].filter(v => v <= maxY);
  const last = hist[hist.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="TVPI 走势">
    ${ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#3A3166" stroke-dasharray="${t===1?'0':'3 5'}" stroke-width="${t===1?2:1}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t}×</text>`).join('')}
    ${Array.from({length:G.maxYear+1},(_,i) => `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i===0?'募资':G.startYear+i-1}</text>`).join('')}
    <polygon points="${area}" fill="#9B8CFF" fill-opacity=".22"/>
    <polyline points="${pts}" fill="none" stroke="#FFC23D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(hist.length-1)}" cy="${y(last.tvpi)}" r="7" fill="#FFC23D" stroke="#16122B" stroke-width="3"/>
  </svg>`;
}

    <div class="vhead">${backBtn()}<h2>LP 报表</h2><p class="tip">TVPI = (已回款 + 未退出估值 + 剩余现金) ÷ 基金规模。DPI 只算真正回到 LP 手里的钱。</p></div>
    <div class="fstats" style="margin-bottom:18px">

        <div class="legend"><span style="--c:var(--k-normal)">常规 ${money(by.normal)}</span><span style="--c:var(--k-ai)">AI ${money(by.ai)}</span><span style="--c:var(--k-abstract)">抽象 ${money(by.abstract)}</span></div>

/* ---------- year-end cinematic ---------- */
const TAG = {up:['融资','good'], flat:['平稳','meh'], down:['降价','bad'], dead:['倒闭','bad'], fraud:['暴雷','bad'], ipo:['上市','good'], acq:['收购','good'], moon:['爆火','wow']};
let cineTimers = [];
function playCine(){
  const C = G.cine; if (!C) return;
  cineTimers.forEach(clearTimeout); cineTimers = [];
  const cards = C.evs.map((e,i) => {
    const stakeB = e.ownBefore*e.before, stakeA = e.status==='alive' ? e.ownAfter*e.after : 0;
    const val = e.pay ? e.pay : stakeA, up = (e.pay || stakeA) >= stakeB;
    const t = TAG[e.type];
    return `<div class="rcard" data-i="${i}" style="animation-delay:${i*90}ms"><div class="backside">${esc([...G.fund][0]||'鲸')}</div>
      <div class="face"><div class="top">${logo(e)}<div><b>${esc(e.name)}</b><small>${STAGES[e.stageBefore]}${e.stage!==e.stageBefore&&e.status==='alive'?' → '+STAGES[e.stage]:''}</small></div></div>
      <p>${esc(e.text)}</p>
      <div class="delta ${up?'up':'down'}">${e.pay ? `回款 ${money(e.pay)}` : `${money(stakeB)} → ${money(stakeA)}`}</div>
      <span class="rstamp ${t[1]}">${t[0]}</span></div></div>`;
  }).join('');
  const miss = C.missed.map((x,i) => `<div class="rcard miss" data-m="${i}"><div class="backside">?</div><div class="face"><div class="top">${logo(x)}<div><b>${esc(x.name)}</b><small>${yl(x.passYear)} 年被你 Pass</small></div></div><p>当时投后只有 ${money(x.entry)}，现在已经是 ${money(x.v)}。</p><div class="delta up">${(x.v/x.entry).toFixed(0)} 倍</div><span class="rstamp bad">心痛</span></div></div>`).join('');
  const el = document.createElement('div'); el.className = 'cine'; el.id = 'cine';
  el.innerHTML = `<div class="cine-in">
    <div class="cine-top"><span class="fx" style="font-size:20px;color:var(--muted)">${esc(G.fund)} · 年终结算</span><button class="b3 sm dark" id="cine-skip">全部翻开</button></div>
    <div class="yearflip"><div class="lbl">年度报告</div><div class="yr">${C.year}</div></div>
    <div class="headlines">${C.news.map((n,i) => `<div style="animation-delay:${.5+i*.35}s"><b>头条</b>${esc(n)}</div>`).join('')}</div>
    ${cards ? `<div class="sec-t">组合开牌</div><div class="deal-row">${cards}</div>` : `<div class="empty"><b>没有在营的被投公司</b>今年没什么可揭晓的。</div>`}
    ${miss ? `<div class="sec-t" style="color:var(--coral)">与此同时，你错过的……</div><div class="deal-row">${miss}</div>` : ''}
    <div class="cine-sum" id="cine-sum" hidden>
      <div><div class="lbl">年初 TVPI</div><div class="big">${C.before.toFixed(2)}×</div></div>
      <div class="big" style="color:var(--muted)">→</div>
      <div><div class="lbl">年末 TVPI</div><div class="big ${C.after>=C.before?'up':'down'}" id="cine-after">${C.before.toFixed(2)}×</div></div>
      <button class="b3 lg" id="cine-go">${C.last ? '查看基金清算 ▶' : `进入 ${C.year+1} 年 ▶`}</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const flip = (card, e) => {
    if (card.classList.contains('flip')) return;
    card.classList.add('flip'); sfx('flip');
    if (!e) return;
    setTimeout(() => {
      if (e.type==='ipo' || e.type==='moon'){ sfx('win'); const r = card.getBoundingClientRect(); confetti(90, (r.left+r.width/2)/innerWidth, (r.top+40)/innerHeight); }
      else if (e.type==='acq' || e.type==='up') sfx('coin');
      else if (e.type==='dead' || e.type==='fraud'){ sfx('stamp'); shake(el.querySelector('.cine-in')); }
    }, 380);
  };
  const all = [...el.querySelectorAll('.rcard')];
  const showSum = () => {
    const s = el.querySelector('#cine-sum'); if (!s.hidden) return; s.hidden = false;
    const a = el.querySelector('#cine-after'); const t0 = performance.now();
    const step = t => { const k = Math.min(1,(t-t0)/900); a.textContent = (C.before + (C.after-C.before)*(1-Math.pow(1-k,3))).toFixed(2)+'×'; if (k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    if (C.after > C.before*1.15) setTimeout(() => confetti(160), 500);
    s.scrollIntoView({behavior: reduced()?'auto':'smooth', block:'center'});
  };
  const base = 1200 + C.news.length*350;
  all.forEach((card,i) => {
    const e = card.dataset.i != null ? C.evs[+card.dataset.i] : null;
    cineTimers.push(setTimeout(() => { flip(card,e); if (i>2) card.scrollIntoView({behavior:'smooth', block:'nearest'}); }, base + i*650));
    card.onclick = () => flip(card,e);
  });
  cineTimers.push(setTimeout(showSum, base + all.length*650 + 500));
  el.querySelector('#cine-skip').onclick = () => { cineTimers.forEach(clearTimeout); all.forEach(c => c.classList.add('flip')); sfx('flip'); showSum(); };
  el.querySelector('#cine-go').onclick = () => {
    cineTimers.forEach(clearTimeout); sfx('click');
    el.remove(); document.body.style.overflow = '';
    G.cine = null; ui.view = 'hub'; ui.deal = 0; save(); render(); scrollTo(0,0);
    if (!G.over){ const p = pendingCount(G); toast(`${yl(G.year)} 年开始${p ? ` · 收件箱有 ${p} 件事等你处理` : ''}`, 'gold'); }
  };
}

/* ---------- final ---------- */
function viewFinal(){
  const s = stats(G), [rank, line] = rankFor(s.tvpi);
  const irr = s.tvpi > 0 ? Math.pow(s.tvpi, 1/4.5) - 1 : -1;
  const carry = Math.max(0, s.total - G.fundSize)*.2;
  const ranked = G.port.slice().sort((a,b) => (valOf(b)-b.cost) - (valOf(a)-a.cost));
  const best = ranked.slice(0,3), worst = ranked.slice(-3).reverse().filter(c => !best.includes(c) && valOf(c) < c.cost);
  const ach = achievements(G);
  const row = c => { const v = valOf(c)-c.cost; return `<div class="lrow">${logo(c)}<div style="min-width:0"><b>${esc(c.name)}</b><small>${KIND[c.k].label} · 成本 ${money(c.cost)} · ${(valOf(c)/c.cost).toFixed(1)}×</small></div><div class="r ${v>=0?'up':'down'}">${v>=0?'+':'−'}${money(Math.abs(v))}</div></div>`; };
  return `<section class="view wrap final">
    <div class="final-hero">
      <div class="fx" style="color:var(--muted);font-size:20px">${esc(G.fund)} · ${G.startYear}–${G.startYear+G.maxYear-1} · 基金清算</div>
      <div class="big ${s.tvpi>=1?'up':'down'}">${s.tvpi.toFixed(2)}×</div>
      <div class="rank">${rank}</div><p>${line}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"><button class="b3 lg" data-act="again">再募一只基金 ▶</button></div>
    </div>
    <div class="fstats">
      <div><div class="k">累计回款</div><div class="v">${money(G.dist)}</div></div>
      <div><div class="k">未退出估值</div><div class="v">${money(s.nav)}</div></div>
      <div><div class="k">未投出现金</div><div class="v">${money(G.cash)}</div></div>
      <div><div class="k">DPI</div><div class="v">${s.dpi.toFixed(2)}×</div></div>
      <div><div class="k">约合 IRR</div><div class="v ${irr>=0?'up':'down'}">${(irr*100).toFixed(1)}%</div></div>
      <div><div class="k">你的 Carry</div><div class="v" style="color:var(--gold)">${money(carry)}</div></div>
    </div>
    <div class="two">
      <div class="panel"><h3>TVPI 走势</h3>${chart(G.hist)}</div>
      <div class="panel"><h3>成就 ${ach.filter(a=>a.ok).length}/${ach.length}</h3><div class="ach">${ach.map((a,i) => `<div class="medal ${a.ok?'':'off'}"><div class="m">${MEDAL[i]}</div><div><b>${a.n}</b><small>${a.d}</small></div></div>`).join('')}</div></div>
      <div class="panel"><h3>最赚钱的项目</h3><div class="list">${best.map(row).join('') || '<p style="color:var(--muted)">没有投资</p>'}</div></div>
      <div class="panel"><h3>亏得最多的</h3><div class="list">${worst.map(row).join('') || '<p style="color:var(--muted)">没有亏损项目，了不起。</p>'}</div></div>
    </div>
  </section>`;
}

/* ---------- overlay helpers ---------- */
function overlay(html){
  closeOverlay();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay'; o.innerHTML = html;
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  return o;
}
function closeOverlay(){ const o = $('#overlay'); if (o) o.remove(); if (!$('#cine')) document.body.style.overflow = ''; }
function confirmRestart(){
  const o = overlay(`<div class="ts-doc"><div class="eyebrow">MENU</div><h3>放弃 ${esc(G.fund)}？</h3><p>这一局的进度会被清空，回到标题画面重新募资。</p>
    <div class="ts-act"><button class="b3 dark" data-act="x">继续这局</button><button class="b3 coral" data-act="y">重新开始</button></div></div>`);
  o.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; closeOverlay(); if (a.dataset.act==='y'){ G = null; save(); render(); scrollTo(0,0); } };
}

/* ---------- render & actions ---------- */
function render(){
  if (!G){ renderStart(); return; }
  if (G.over && !G.cine){ $('#app').innerHTML = hud() + viewFinal(); return; }
  const v = {hub:viewHub, pitch:viewPitch, port:viewPort, market:viewMarket, inbox:viewInbox, fund:viewFund, trophy:viewTrophy}[ui.view] || viewHub;
  $('#app').innerHTML = hud() + v();
  const s = stats(G);
  tween('h-cash', G.cash, money); tween('h-nav', s.nav, money); tween('h-tvpi', s.tvpi, x => x.toFixed(2)+'×');
  if (ui.view==='pitch') scrollChat();
  if (G.cine && !$('#cine')) playCine();
}
function go(view){ ui.view = view; if (view==='pitch'){ const i = G.deals.findIndex(d => d.state==='open'); if (i>=0 && (G.deals[ui.deal]||{}).state!=='open') ui.deal = i; } render(); scrollTo(0,0); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled || a.closest('#overlay')) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act !== 'sound') sfx('click');
  const d = G && G.deals[ui.deal];
  switch (act){
    case 'persona': ui.persona = id; ui.fund = $('#fund').value; renderStart(); break;
    case 'start': G = newGame(ui.persona, ($('#fund').value || '鲸落资本').trim()); ui.view = 'hub'; save(); render(); scrollTo(0,0); sfx('coin'); confetti(100, .5, .2); toast(`${G.fund} 募资完成：$${G.fundSize}M 到账`, 'gold'); break;
    case 'resume': G = loadSave(); ui.view = 'hub'; render(); break;
    case 'sound': ui.sound = !ui.sound; render(); break;
    case 'menu': confirmRestart(); break;
    case 'go': go(id); break;
    case 'deal': ui.deal = +id; render(); break;
    case 'ask': askFounder(d, QUESTIONS[id]); break;
    case 'aiset': openAISettings(); break;
    case 'dd': {
      const r = doDD(G,d);
      if (r.sniped){ sfx('bad'); say(d, `不好意思，${d.lead} 昨晚已经签了。下次早点来。`); toast(`尽调还没做完，${d.name} 被 ${d.lead} 抢走了`, 'bad'); }
      else if (r.ok){ const red = d.flags.filter(f => f.c!=='g').length, x = d.flags.some(f => f.c==='x');
        if (x){ sfx('bad'); toast('尽调发现了红旗！', 'bad'); d.mood = 'sweat'; } else { sfx('coin'); toast(red ? `尽调完成：发现 ${red} 个风险点` : '尽调完成：底子很干净', red ? '' : 'good'); }
        say(d,  x ? '这个……财务那边可能有点误会，我回去核实一下。' : '材料都给你们了，有问题随时问。'); }
      save(); render(); break; }
    case 'offer': openTS(); break;
    case 'pass':
      if (d.state==='open'){ d.state = 'passed'; sfx('stamp'); const n = G.deals.findIndex(x => x.state==='open'); if (n>=0) setTimeout(() => { ui.deal = n; render(); }, 700); }
      else if (d.state==='passed') d.state = 'open';
      save(); render(); break;
    case 'roadshow':
      if (G.energy >= 2 && !G.roadshow){ G.energy -= 2; G.roadshow = true; G.deals.push(genDeal(G)); ui.deal = G.deals.length-1; sfx('coin'); toast('路演日认识了一位新创始人'); save(); render(); }
      break;
    case 'comp': ui.comp = +id; render(); break;
    case 'boost': {
      const c = G.port.find(x => x.id===ui.comp);
      if (boost(G,c,id)){ sfx('coin'); toast({clients:`给 ${c.name} 介绍了三个大客户`, hire:`帮 ${c.name} 挖来一位大厂高管`, pr:`${c.name} 上了财经头条`}[id], 'good'); save(); render(); }
      break; }
    case 'msg': ui.msg = +id; render(); break;
    case 'reply': {
      const m = G.inbox.find(x => x.id===ui.msg);
      const r = resolveMsg(G,m,+id);
      if (r){ sfx('stamp'); toast(r, 'gold'); save(); render(); }
      break; }
    case 'endyear':
      if (pendingCount(G)) { toast('先处理收件箱里的事', 'bad'); break; }
      endYear(G); save(); render(); break;
    case 'again': { const name = G.fund; G = null; save(); ui.fund = name; render(); scrollTo(0,0); break; }
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'askform') return;
  e.preventDefault();
  const box = $('#qbox'), d = G && G.deals[ui.deal];
  if (d && box.value.trim()){ sfx('click'); askFounder(d, box.value); }
});
window.claude?.use?.('sample')?.then(s => { AI.sample = s || null; if (G && (ui.view==='pitch')) render(); }, () => {});

function start(data){
  if (data && data.G) G = data.G;
  if (data && data.ui) Object.assign(ui, data.ui);
  render();
}
window.claude?.hot?.snapshot?.(() => ({G, ui:{view:ui.view, deal:ui.deal, comp:ui.comp, msg:ui.msg}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
