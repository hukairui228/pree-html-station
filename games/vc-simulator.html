<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>风投人生</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: an investment firm's internal workspace. Left rail navigation, a top bar with the fund clock and KPIs,
   and work views that look like the real tools a GP uses: a mail client, a deal pipeline board, a cap-table style
   portfolio, LP reporting. Documents (BPs, LP letters) render as paper pages. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface-2:#F0F0EC; --ink:#1A1D21; --ink-2:#3B4148; --muted:#6F757D;
  --line:#E2E2DD; --line-2:#CFCFC8;
  --accent:#23416B; --accent-ink:#FFFFFF; --accent-soft:#E5EBF4;
  --gain:#1C7449; --gain-soft:#E1F1E8; --loss:#B0352A; --loss-soft:#F7E5E2; --warn:#8F5E00; --warn-soft:#FAEFD6;
  --k-normal:#46695A; --k-ai:#3B5BA5; --k-abstract:#9C4476;
  --paper:#FFFFFF; --paper-ink:#1A1D21; --paper-muted:#6F757D; --paper-line:#E6E6E1;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 6px 18px -10px rgba(20,24,30,.22);
  --scrim:rgba(18,21,25,.45);
  --f-body:"IBM Plex Sans","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:var(--f-body);
  --f-doc:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#191C20; --surface-2:#21252A; --ink:#E6E8EB; --ink-2:#C2C7CD; --muted:#8A9199;
  --line:#2B3036; --line-2:#3A4047;
  --accent:#8EAEE0; --accent-ink:#111316; --accent-soft:#1E2A3D;
  --gain:#5DC28C; --gain-soft:#15301F; --loss:#EC7B6B; --loss-soft:#3A1E1A; --warn:#E0AE4F; --warn-soft:#352911;
  --k-normal:#7FB29C; --k-ai:#86A5EA; --k-abstract:#DC84B6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#191C20; --surface-2:#21252A; --ink:#E6E8EB; --ink-2:#C2C7CD; --muted:#8A9199;
  --line:#2B3036; --line-2:#3A4047;
  --accent:#8EAEE0; --accent-ink:#111316; --accent-soft:#1E2A3D;
  --gain:#5DC28C; --gain-soft:#15301F; --loss:#EC7B6B; --loss-soft:#3A1E1A; --warn:#E0AE4F; --warn-soft:#352911;
  --k-normal:#7FB29C; --k-ai:#86A5EA; --k-abstract:#DC84B6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--gain)} .down{color:var(--loss)} .warnc{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--ink-2);background:var(--surface-2)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.btn.danger{color:var(--loss)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.lg{height:40px;padding:0 18px;font-size:14px}
.btn .cost{font-family:var(--f-mono);font-size:11px;opacity:.7}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.gain{background:var(--gain-soft);color:var(--gain)}
.tag.loss{background:var(--loss-soft);color:var(--loss)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.k-normal{color:var(--k-normal)} .tag.k-ai{color:var(--k-ai)} .tag.k-abstract{color:var(--k-abstract)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:16px 10px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.firm{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.firm .mk{width:32px;height:32px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-doc);font-weight:700;font-size:16px;flex:none}
.firm b{display:block;font-size:14px;line-height:1.2}
.firm small{font-size:11.5px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav svg{width:17px;height:17px;flex:none;opacity:.8}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.nav .cnt.hot{background:var(--loss);color:#fff}
.rail .sep{height:1px;background:var(--line);margin:10px 6px}
.rail .foot{margin-top:auto;padding:10px 8px 0;font-size:11.5px;color:var(--muted);display:grid;gap:8px}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
.clock{display:flex;align-items:center;gap:10px}
.clock .date{font-weight:600;font-size:14px;white-space:nowrap}
.clock .date small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.speed{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.speed button{width:34px;height:30px;display:grid;place-items:center;color:var(--muted);border-right:1px solid var(--line)}
.speed button:last-child{border-right:0}
.speed button svg{width:14px;height:14px}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weekbar{width:120px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.weekbar i{display:block;height:100%;background:var(--accent);width:0}
.weekbar i.run{animation:wk linear forwards}
@keyframes wk{from{width:0}to{width:100%}}
.kpis{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;align-items:center}
.kpi .k{font-size:11px;color:var(--muted);white-space:nowrap}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap}
.slots{display:flex;gap:3px;margin-top:4px}
.slots i{width:9px;height:12px;border-radius:2px;background:var(--line-2)}
.slots i.on{background:var(--accent)}

.main{padding:22px 24px 64px;min-width:0}
.vh{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.vh p{color:var(--muted);font-size:13px;flex:1 1 260px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.statrow > div{background:var(--surface);padding:12px 14px}
.statrow .k{font-size:11.5px;color:var(--muted)}
.statrow .v{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.statrow .s{font-size:11.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tr.dim td{color:var(--muted)}
.tbl tr.me td{background:var(--accent-soft)}
.co{display:flex;align-items:center;gap:9px;min-width:0}
.co b{font-weight:600}
.co small{display:block;font-size:11.5px;color:var(--muted)}
.mono-logo{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:-.02em}
.mono-logo.k-normal{background:var(--k-normal)} .mono-logo.k-ai{background:var(--k-ai)} .mono-logo.k-abstract{background:var(--k-abstract)}
.mono-logo.lg{width:44px;height:44px;font-size:19px;border-radius:9px}
.initials{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* ---------- inbox ---------- */
.mail{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;min-height:calc(100vh - 170px)}
.mfilters{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mfilters button{height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--muted);border:1px solid transparent}
.mfilters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.mlist{border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 170px)}
.mrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative}
.mrow:hover{background:var(--surface-2)}
.mrow[aria-current="true"]{background:var(--accent-soft)}
.mrow .from{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .subj{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .snip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .when{font-size:11px;color:var(--muted);text-align:right;display:grid;gap:4px;justify-items:end}
.mrow.unread .from,.mrow.unread .subj{font-weight:700}
.mrow.unread::before{content:"";position:absolute;left:4px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mrow.done{opacity:.6}
.mread{overflow-y:auto;max-height:calc(100vh - 170px);min-width:0}
.mhead{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.mhead h2{font-size:18px;font-weight:600}
.mhead .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.mhead .meta b{color:var(--ink);font-weight:600}
.mbody{padding:18px 24px 24px;display:grid;gap:14px;max-width:760px}
.mbody p{font-size:14px;line-height:1.75}
.attach{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:max-content;max-width:100%;background:var(--surface)}
.attach .pdf{width:34px;height:40px;border-radius:3px;background:var(--loss);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:end center;padding-bottom:5px;flex:none}
.attach b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach small{font-size:11.5px;color:var(--muted)}
.mact{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.choice{display:grid;gap:8px}
.choice button{text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);display:grid;gap:2px}
.choice button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice button:disabled{opacity:.45}
.choice b{font-size:13.5px;font-weight:600}
.choice small{font-size:12px;color:var(--muted)}
.resolved{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.kpitable{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* ---------- pipeline ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.col-h .n{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.dcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:grid;gap:7px;box-shadow:var(--shadow);width:100%}
.dcard:hover{border-color:var(--line-2)}
.dcard .t{display:flex;align-items:center;gap:8px;min-width:0}
.dcard .t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.dcard .row .num{color:var(--ink)}
.dl{font-family:var(--f-mono);font-size:11.5px}
.dl.urgent{color:var(--loss);font-weight:600}
.rivals{display:flex;gap:3px;align-items:center}
.rivals i{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.rivals i.on{background:var(--loss)}

/* deal room */
.room{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;align-items:start}
.room-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.room-h h1{font-size:22px}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.steps div{flex:1;padding:9px 12px;font-size:12px;color:var(--muted);border-right:1px solid var(--line);display:flex;gap:8px;align-items:center;min-width:0}
.steps div:last-child{border-right:0}
.steps div.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.steps div.ok{color:var(--gain)}
.steps .n{font-family:var(--f-mono);font-size:11px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{height:38px;padding:0 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.metrics{display:grid;gap:12px}
.mrow2{display:grid;grid-template-columns:56px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:12.5px}
.mrow2 .lab{color:var(--muted)}
.mrow2 .val{text-align:right;font-family:var(--f-mono)}
.ci{position:relative;height:10px;border-radius:2px;background:var(--surface-2)}
.ci .band{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.18;border-radius:2px;transition:all .5s}
.ci .band.sure{opacity:.5}
.ci .pt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-1px);transition:left .5s}
.ci .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--line) calc(20% - 1px) 20%)}
.flags{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flags li{display:flex;gap:8px;font-size:13px;padding:7px 10px;border-radius:6px;background:var(--surface-2)}
.flags li .tag{flex:none}
.offers{display:grid;gap:6px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.offer.mine{border-color:var(--accent);background:var(--accent-soft)}

/* meeting transcript */
.transcript{display:grid;gap:12px;max-height:420px;overflow-y:auto;padding:14px 16px;overscroll-behavior:contain}
.tl{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.tl .who{font-size:12px;font-weight:600}
.tl .who small{font-weight:400;color:var(--muted);margin-left:6px}
.tl p{font-size:13.5px;line-height:1.7;margin-top:1px}
.tl.me .initials{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl .hint{display:inline-block;margin-top:4px}
.typing{display:inline-flex;gap:3px;padding-top:6px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{40%{opacity:.2}}
.askbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.askbar input{flex:1;min-width:0;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.askbar input:focus{outline:none;border-color:var(--accent)}
.qs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.qs button{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-2)}
.qs button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.qs button:disabled{opacity:.4}

/* ---------- documents ---------- */
.doc-ov{position:fixed;inset:0;z-index:60;background:var(--scrim);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.doc-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto 14px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.doc-bar b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-bar .r{margin-left:auto;display:flex;gap:8px}
.slide{max-width:900px;margin:0 auto 18px;aspect-ratio:16/9;background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 10px 40px -12px rgba(0,0,0,.45);padding:5.2% 6%;display:flex;flex-direction:column;position:relative;overflow:hidden}

  const em = g.inbox.find(m => m.did===d.id); if (em) em.done = true;
  if (d.state==='won') return;
  const b = bestRival(g, d);
  const winner = d.state==='lost' && d.lostTo && d.lostTo!=='walk' ? d.lostTo : (b ? b.o.who : null);
  const post = (b ? b.o.pre : d.pre) + d.ask;
  const co = {id:d.id, k:d.k, group:d.group, name:d.name, tag:d.tag, founder:d.founder, seed:d.seed, stage:d.stage, q:d.q, sigma:d.sigma, fraud:d.fraud,
    own:0, cost:0, entry:post, val:post, status:'alive', proceeds:0, exitVal:0, help:0, next:g.w + ri(26,60), seen:true, how:d.state, passW:g.w, owner:winner||'other'};
  if (winner && winner!=='other'){
    const r = rival(g, winner), amt = d.ask*rnd(.5,1);
    const rc = Object.assign({}, co, {own:amt/post, cost:amt, q:clamp(co.q + .08 + (r.rep-50)/400, .03, .97)});
    r.port.push(rc); co.rivalRef = true; co.rivalName = r.name;
  }
  g.world.push(co);
}
function rivalTick(g, d){
  if (!['new','meet','dd','ts'].includes(d.state)) return null;
  const mk = {bull:1.3, flat:1, bear:.7}[g.market.cycle];
  let msg = null;
  g.rivals.forEach(r => {
    if (d.offers.some(o => o.who===r.id)) return;
    if (R() < .035*d.heat*(r.style[d.group]||1)*r.aggr*mk){
      d.offers.push({who:r.id, pre:r2(d.pre*rnd(.9,1.1)*r.aggr), w:g.w});
      if (d.met) msg = `${r.name} 也给 ${d.name} 递了 TS`;
    }
  });
  // a hot deal can be snapped up before its official close if someone outbids and you are not in it
  const b = bestRival(g, d);
  if (b && b.o.pre >= floorPre(d) && !d.mine && R() < .22){ d.state = 'lost'; d.lostTo = b.o.who; resolveDeal(g, d); return {lost:true, by:b.o.who}; }
  return msg ? {msg} : null;
}
function closeDeal(g, d){
  const b = bestRival(g, d);
  if (d.mine && (!b || offerScore(g,d,d.mine) >= b.s)){ const c = closeWon(g, d); return c ? {won:true, c} : {lost:true, by:'other'}; }
  if (d.state==='new' && !d.met && !b){ d.state = 'passed'; resolveDeal(g, d); return {expired:true}; }
  d.state = 'lost'; d.lostTo = b ? b.o.who : 'other'; resolveDeal(g, d);
  return {lost:true, by:d.lostTo};
}

/* ---------- companies ---------- */
function payout(c, E){ return Math.max(c.own*E, Math.min(c.cost, E*.5)); }
function stepCompany(g, c){
  if (c.status !== 'alive') return null;
  const m = g.market, mine = c.owner==='me';
  const ev = {id:c.id, name:c.name, k:c.k, before:c.val, ownBefore:c.own, stageBefore:c.stage, type:'', text:'', raise:null, pay:0};
  c.next = g.w + ri(36,70);
  const done = () => { ev.after = c.val; ev.status = c.status; ev.stage = c.stage; c.last = ev.type;
    if (c.hist) c.hist.push({w:g.w, val:c.val || c.exitVal || 0, t:ev.type, txt:ev.text}); return ev; };
  if (c.fraud && R() < .38){
    c.status='fraud'; c.val=0; ev.type='fraud';
    ev.text = pick(['被曝虚构八成收入，创始人已失联','审计发现“头部客户”是创始人表弟的公司','账上资金被挪去炒币，全部归零']);
    if (mine){ g.rep = clamp(g.rep-6,0,100); g.stats.fraud++; }
    return done();
  }
  if (c.k==='abstract' && R() < .02*(m.cycle==='bull'?1.4:1)){
    c.val *= rnd(3,9); c.stage = Math.min(5, c.stage+2); c.q = Math.min(.9, c.q+.25);
    ev.type='moon'; ev.text = pick(['在海外社交媒体意外爆火，一周涨粉 2000 万','被顶流明星直播带货，订单排到明年','成为年度现象级网络梗，估值一夜暴涨']);
    if (mine) g.rep = clamp(g.rep+4,0,100);
    return done();
  }
  const mk = {bull:.07, flat:0, bear:-.08}[m.cycle];
  const ai = c.k==='ai' ? (m.aiCrashed ? (g.w - m.crashW < 40 ? -.15 : -.03) : clamp((m.aiHype-1.6)*.1, -.05, .07)) : 0;
  const r = .5 + (c.q-.5)*.75 + gauss()*c.sigma + mk + ai + Math.min(3, c.help)*.05 + (c.bridge?.08:0) - (c.bridgeDenied?.15:0) + ((c.rel ?? 60) - 60)/600;
  c.help = 0; c.bridge = false; c.bridgeDenied = false;
  const exit = (status, mult, text) => {
    c.status = status; c.exitVal = c.val*mult; ev.type = status; ev.text = text;
    if (c.own > 0){ ev.pay = payout(c, c.exitVal); c.proceeds += ev.pay; }
    if (mine){ const f = fundOf(g,c); f.dist += ev.pay; g.rep = clamp(g.rep + (ev.pay > c.cost ? (status==='ipo'?6:3) : 0), 0, 100); addXp(g, c.group, 10); g.stats.exits++; }
    c.val = 0; return done();
  };
  if (c.stage>=4 && r>.5 && R() < .5 + ((g.w-(c.inv??c.passW??0))>=260?.2:0)){
    if (r>.64 && m.cycle!=='bear') return exit('ipo', rnd(1.1,2.2)*(m.cycle==='bull'?1.2:1), `在${pick(BOARDS)}敲钟上市，首日上涨 ${Math.round(rnd(20,160))}%`);
    return exit('acq', rnd(.8,1.6), `被${pick(BUYERS)}全资收购`);
  }
  if (c.stage>=2 && r>.38 && r<.62 && R()<.07) return exit('acq', rnd(.6,1.3), `被${pick(BUYERS)}战略收购`);
  if (r < .26 || (r < .36 && c.stage <= 1 && R() < .5)){
    c.status='dead'; c.val=0; ev.type='dead';
    ev.text = c.k==='ai' ? pick(['被基础模型的一次更新直接取代','烧光了算力预算，宣布解散','核心团队集体跳槽去了大厂'])
            : c.k==='abstract' ? pick(['热度退去，库存堆满了创始人老家的院子','创始人宣布“回归初心”，公司注销','被监管约谈后火速关停'])
            : pick(['现金流断裂，宣布解散','团队解散，创始人去考公了','被巨头补贴战打穿，黯然离场']);
    if (mine) g.rep = clamp(g.rep-2,0,100);
    return done();
  }
  if (r < .42){ c.val *= rnd(.45,.8); c.own *= .9; ev.type='down'; ev.text = pick(['以折价完成过桥融资，估值下调','业绩不及预期，被迫降价融资','裁员三分之一，勉强续命']); return done(); }
  if (r < .67){ c.val *= rnd(.82,1.12); ev.type='flat'; ev.text = pick(['稳步经营，暂未开启新一轮','收入稳步增长，但还没到融资节点','在细分市场站稳了脚跟']); return done(); }
  const mult = clamp(1.15 + (r-.67)*4 + rnd(-.2,.3), 1.1, 3.6);
  const pre = c.val*mult, amt = pre*rnd(.15,.25), dil = pre/(pre+amt);
  c.val = pre + amt; c.stage = Math.min(5, c.stage+1);
  const lead = R() < .5 ? pick(g.rivals).name : pick(['高岭资本','远山基金','青萍创投','北纬资本','半岛基金']);
  ev.type='up'; ev.text=`完成${STAGES[c.stage]}融资，${lead}领投，估值涨 ${mult.toFixed(1)} 倍`;
  ev.raise = {amt:r2(amt), cost:r2(c.own*amt), ownBefore:c.own, ownAfter:c.own*dil};
  if (c.rounds) c.rounds.push({w:g.w, stage:c.stage, pre, amt, lead});
  c.own *= dil;
  if (mine) g.rep = clamp(g.rep+1,0,100);
  return done();
}

// the numbers a founder quotes; claimed=true gives the inflated story a fraud founder tells
function facts(d, claimed){
  const tr = claimed && d.fraud ? Math.max(d.tru.traction, d.claim ?? d.tru.traction) : d.tru.traction;
  const S = [1,4,15,40,100,250][d.stage] || 1, j = (hashN(d.seed) % 17) / 100;
  const grow = d.entry && d.val ? clamp(d.val/d.entry, .3, 40) / Math.max(1, S/[1,4,15][Math.min(2,d.stage)]) : 1;
  return {
    team: Math.round([5,14,38,80,160,300][d.stage] * (.6 + d.tru.team/5)),
    mrr: Math.max(.5, Math.round(S*9*Math.pow(tr/3, 2.2)*(1+j)*grow*10)/10),
    growth: Math.round(1 + tr*3.2 + j*10),
    customers: Math.max(1, Math.round(S*18*tr*(1+j)*grow)),
    tam: Math.round(Math.pow(10, .6 + d.tru.market*.75)),
    nps: Math.round(5 + d.tru.product*14),
    runway: Math.round(5 + tr*2.5)
  };
}

function mkEmail(g, o){ const em = Object.assign({id:g.nid++, w:g.w, read:false, done:false}, o); g.inbox.unshift(em); if (g.inbox.length > 260) g.inbox.length = 260; return em; }
function companyEvent(g, c, prio){
  const keys = Object.keys(EVENTS).filter(k => EVENTS[k].cond(c, g));
  if (!keys.length) return null;
  const k = pick(keys), ev = EVENTS[k].build(g, c); ev.type = k;
  return mkEmail(g, {type:'event', cid:c.id, from:`${c.founder}（${c.name}）`, subj:ev.title, ev, deadline:g.w+3, prio:true});
}
function boardMeeting(g, c){
  c.lastBoard = g.w;
  const f = facts(c, false);
  const ev = R() < .45 ? (() => { const keys = Object.keys(EVENTS).filter(k => EVENTS[k].cond(c, g)); if (!keys.length) return null; const k = pick(keys); const e = EVENTS[k].build(g,c); e.type = k; return e; })() : null;
  return mkEmail(g, {type:'board', cid:c.id, from:`${c.name} 董事会秘书`, subj:`${c.name} ${dateOf(g.w).y} 年第 ${Math.floor((g.w%52)/13)+1} 季度董事会`, ev, kpi:f, deadline:g.w+2, prio:!!ev});
}
function resolveEmail(g, m, i){
  if (m.done) return null;
  const c = m.cid ? g.port.find(x => x.id===m.cid) : null;
  if (m.type==='follow'){
    const f = fundOf(g, c);
    if (i===0){
      if (!f || f.closed || f.cash < m.cost || c.status!=='alive') return null;
      f.cash = r2(f.cash - m.cost); c.cost += m.cost; c.own = m.ownBefore; g.stats.follows++;
      m.result = `已跟投 $${m.cost}M，保住 ${(m.ownBefore*100).toFixed(1)}% 股份`; addLog(g, `跟投 ${c.name} $${m.cost}M`);
    } else m.result = `放弃跟投，持股稀释到 ${(m.ownAfter*100).toFixed(1)}%`;
    m.done = true; return m.result;
  }
  if (m.type==='board'){
    if (i==='attend'){ if (!useSlots(g,1)) return null; c.help += 1; c.rel = Math.min(100, c.rel+5); m.attended = true; if (!m.ev){ m.done = true; m.result = '你参加了董事会'; } return '你参加了董事会'; }
    if (i==='skip'){ c.rel = Math.max(0, c.rel-3); if (!m.ev){ m.done = true; m.result = '你请假没去'; } else m.skipped = true; return '这次董事会你没去'; }
  }
  if ((m.type==='event' || m.type==='board') && m.ev){
    if (!c || c.status!=='alive'){ m.done = true; m.result = '公司已经不在了'; return m.result; }
    const opt = m.ev.opts[i];
    if (opt.cost){ const f = fundOf(g,c); if (!f || f.closed || f.cash < opt.cost) return null; }
    const txt = EVENTS[m.ev.type].apply(g, c, m.ev, i);
    if (txt == null) return null;
    m.done = true; m.result = txt; m.choice = i; addLog(g, txt);
    return txt;
  }
  if (m.type==='note' || m.type==='report' || m.type==='news'){ m.done = true; return null; }
  return null;
}

/* ---------- fundraising & team ---------- */
function canRaise(g){
  if (g.raise || g.w < (g.raiseCooldown||0) || g.funds.length >= FUND_NAMES.length) return false;
  const cf = g.funds[g.funds.length-1];
  if (!cf) return true;
  return fundStats(g, cf).deployed >= .5 || g.w >= cf.investEnd - 26;
}
function startRaise(g, mult){
  const last = g.funds[g.funds.length-1];
  const target = Math.round(last.size * mult);
  const names = LP_NAMES.slice().sort(() => R()-.5).slice(0, 10);
  const lps = names.map(([name, type]) => { const T = LP_TYPES[type]; return {name, type, ticket: Math.max(1, Math.round(target*rnd(T.lo,T.hi))), status:'open', next:g.w}; });
  g.raise = {name: g.name + FUND_NAMES[g.funds.length], target, committed:0, start:g.w, end:g.w+39, lps};
  addLog(g, `启动 ${g.raise.name} 募资，目标 $${target}M`);
}
function lpChance(g, lp){
  const T = LP_TYPES[lp.type], tr = trackRecord(g), bg = BACKGROUNDS[g.bg];
  let p = .2 + (g.rep-50)/110 + (tr.tvpi-1)*(tr.tvpi<1 ? .6 : .28) + tr.dpi*.15 + {bull:.1, flat:0, bear:-.14}[g.market.cycle] + (bg.lp||0);
  if (T.need.rep && g.rep < T.need.rep) p -= .3;
  if (T.need.tvpi && tr.tvpi < T.need.tvpi) p -= .3;
  if (T.need.dpi && tr.dpi < T.need.dpi) p -= .3;
  if (T.like && T.like.some(s => xpLvl(g,s) >= 2)) p += .1;
  if (g.funds.length===1 && g.w < 104) p -= .05;
  return clamp(p, .04, .92);
}
function lpMeeting(g, lp){
  if (lp.status!=='open' || g.w < lp.next) return null;
  if (!useSlots(g, 1)) return {err:'本周时间不够了'};
  if (R() < lpChance(g, lp)){ lp.status = 'committed'; g.raise.committed += lp.ticket; return {ok:true}; }
  lp.next = g.w + 8; lp.tries = (lp.tries||0) + 1; if (lp.tries >= 2) lp.status = 'declined';
  return {no:true};
}
function closeRaise(g){
  const r = g.raise; if (!r || r.committed < r.target*.4) return false;
  const f = {id:g.funds.length+1, name:FUND_NAMES[g.funds.length], size:r.committed, cash:r.committed, vintage:g.w, investEnd:g.w+156, end:g.w+364, dist:0, closed:false};
  g.funds.push(f); g.raise = null; g.rep = clamp(g.rep+3,0,100);
  addLog(g, `${g.name}${f.name}完成关账，规模 $${f.size}M`);
  mkEmail(g, {type:'note', from:'基金法务', subj:`${g.name}${f.name}正式关账：$${f.size}M`, body:`恭喜。${f.name}已完成最终关账，规模 $${f.size}M。投资期三年，存续期七年。新的项目会从这只基金出资；老基金的被投公司继续由老基金跟投。`});
  g.stats.raised = Math.max(g.stats.raised, g.funds.length);

}
function genCandidates(g){
  const roles = ['analyst','associate','associate','principal','partner'];
  g.candidates = [0,1,2].map(() => { const role = pick(roles), R0 = ROLES[role];
    return {id:g.nid++, role, name:pick(SURN)+pick(GIVEN), slots:R0.slots, salary:r2(R0.salary*rnd(.85,1.2)), sector: R0.sector ? pick(GROUPS) : null,

function hire(g, cand){
  const R0 = ROLES[cand.role];
  if (R0.minAum && aum(g) < R0.minAum) return {err:`管理规模达到 $${R0.minAum}M 才请得动合伙人`};
  if (g.gp < cand.salary*.5) return {err:'GP 账户的钱不够付半年薪水'};

/* ---------- market & clock ---------- */
function marketWeek(g){
  const m = g.market, out = [];
  if (g.w >= m.nextCycle){
    const T = {flat:[['bull',.5],['bear',.35]], bull:[['bear',.55],['flat',.45]], bear:[['flat',.75],['bull',.25]]};
    const rr = R(); let acc = 0, nc = m.cycle;
    for (const [s,p] of T[m.cycle]){ acc += p; if (rr < acc){ nc = s; break; } }
    if (nc !== m.cycle){ m.cycle = nc; out.push(pick(CYCLE_NEWS[nc])); }
    m.nextCycle = g.w + ri(40, 90);
  }
  if (!m.aiCrashed){
    m.aiHype = r2(Math.min(3, m.aiHype + rnd(-.012,.02)));
    if (g.w > 60 && R() < .0015 + g.w*.000012 + (m.aiHype-1.5)*.002){ m.aiCrashed = true; m.crashW = g.w; m.aiHype = .75; out.push('AI 泡沫破裂：头部模型公司裁员过半，“套壳”项目成批倒下'); }
    else if (R() < .03) out.push(pick(AI_NEWS));
  } else m.aiHype = r2(Math.min(1.35, m.aiHype + .0025));
  m.hypeHist.push(m.aiHype); if (m.hypeHist.length > 260) m.hypeHist.shift();
  return out;
}

function leagueTable(g){

  return rows.sort((a,b) => b.tvpi - a.tvpi);

function annual(g, N){

function careerScore(g){
  const closed = g.funds.filter(f => f.closed), open = g.funds.filter(f => !f.closed);
  let size = 0, val = 0;
  g.funds.forEach(f => { const s = f.closed ? {total: f.dist} : fundStats(g, f); size += f.size; val += s.total; });

const IN_CLAUDE = !!window.claude;
const AI = {cfg:{mode:'auto', key:'', model:'deepseek-chat'}, sample:null, warned:false, busy:new Set()};

function provider(){
  const m = AI.cfg.mode;
  if (m==='offline') return 'offline';
  if (m==='deepseek') return AI.cfg.key && !IN_CLAUDE ? 'deepseek' : 'offline';
  if (m==='claude') return AI.sample ? 'claude' : 'offline';
  return AI.cfg.key && !IN_CLAUDE ? 'deepseek' : AI.sample ? 'claude' : 'offline';
}
const PROV_LABEL = {deepseek:'DeepSeek', claude:'Claude', offline:'离线剧本'};
function parseJSON(s){
  if (s && typeof s === 'object') return s;
  s = String(s || '').replace(/^```(?:json)?\s*|\s*```$/g, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  return JSON.parse(a >= 0 ? s.slice(a, b+1) : s);
}
async function callDeepSeek(system, turns){
  if (IN_CLAUDE) throw new Error('claude.ai 页面不允许连接外部网站，请在本地打开独立 HTML 版');
  let r;
  try {
    r = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + AI.cfg.key},
      body: JSON.stringify({model: AI.cfg.model || 'deepseek-chat', messages:[{role:'system', content:system}, ...turns], response_format:{type:'json_object'}, temperature:1.1, max_tokens:900})
    });
  } catch(e){ throw new Error('连不上 api.deepseek.com，请检查网络或代理'); }
  if (!r.ok){ let m = ''; try { m = (await r.json()).error?.message || ''; } catch(e){} throw new Error(r.status===401 ? 'API Key 无效' : r.status===402 ? '账户余额不足' : `HTTP ${r.status} ${m}`); }
  const j = await r.json();
  return parseJSON(j.choices?.[0]?.message?.content);
}
async function callClaude(system, turns){
  const transcript = turns.map(t => (t.role==='user' ? '投资人：' : '你：') + t.content).join('\n');
  const { text } = await AI.sample(`${system}\n\n${transcript}`, {modelTier:'quick', cache:false});
  return parseJSON(text);
}
async function runAI(system, turns){
  const p = provider();
  if (p==='offline') return null;
  try { return {res: await (p==='deepseek' ? callDeepSeek : callClaude)(system, turns), p}; }
  catch(e){
    const msg = e && (e.message || e.code) || '未知错误';
    if (p==='deepseek' && AI.sample){
      if (!AI.warned){ toast('DeepSeek 连不上，改用 Claude', msg, 'loss'); AI.warned = true; }
      try { return {res: await callClaude(system, turns), p:'claude'}; } catch(e2){}
    }
    if (!AI.warned){ toast('AI 暂时不可用，改用离线剧本', msg, 'loss'); AI.warned = true; }
    return null;
  }
}
function chatTurns(d){
  const turns = d.chat.filter(m => !m.pending && m.t).map(m => ({role: m.r==='me' ? 'user' : 'assistant', content: m.t}));
  if (turns.length && turns[0].role==='assistant') turns.unshift({role:'user', content:'请开始你的介绍。'});

async function ensurePitch(d){
  if (d.pitch || AI.busy.has('p'+d.id) || !d.met) return;
  const p = provider();
  if (p==='offline'){ d.pitch = offlinePitch(d); d.chat.unshift({r:'f', t:d.pitch.opening, open:true}); save(); render(); return; }
  AI.busy.add('p'+d.id);

  const out = await runAI(personaPrompt(d) + '\n\n' + PITCH_FMT, [{role:'user', content:'请开始你的介绍。'}]);
  AI.busy.delete('p'+d.id);

  d.pitch = pitch;
  const i = d.chat.findIndex(m => m.open); if (i >= 0) d.chat[i] = {r:'f', t:pitch.opening, open:true};

async function askFounder(d, text){

  AI.busy.add('q'+d.id); render();
  const out = await runAI(personaPrompt(d) + '\n\n' + ANSWER_FMT, [...prior, {role:'user', content:text}]);
  const res = out && out.res && out.res.reply ? out.res : offlineAnswer(d, text);
  const topic = ['team','market','product','traction'].includes(res.topic) ? res.topic : topicOf(text);
  revealTopic(d, topic);
  d.mood = ['smile','neutral','sweat','angry'].includes(res.mood) ? res.mood : 'neutral';
  const i = d.chat.findIndex(m => m.pending && !m.open);
  if (i >= 0) d.chat[i] = {r:'f', t:String(res.reply), topic};
  AI.busy.delete('q'+d.id);
  save(); render();
}

const MFILTERS = [['todo','待处理'],['all','全部'],['bp','项目'],['port','被投公司'],['lp','报告与 LP']];
function mailMatch(m, f){
  if (f==='all') return true;
  if (f==='todo') return !m.done && (m.prio || m.type==='bp');
  if (f==='bp') return m.type==='bp';
  if (f==='port') return ['follow','event','board'].includes(m.type);
  return ['note','report','news'].includes(m.type);
}
function mailSnip(m){
  const d = m.did ? G.deals.find(x => x.id===m.did) : null;
  if (m.type==='bp') return d ? `${money(d.ask)} @ ${money(d.pre)} 投前 · ${d.sector}` : '项目已结束';
  if (m.type==='follow') return `按比例跟投需要 ${money(m.cost)}`;
  if (m.ev) return m.ev.body;
  if (m.type==='board') return '季度经营数据与议程';
  if (m.league) return '年度机构排名';
  return (m.body||'').slice(0, 60);
}
function mailTag(m){
  const d = m.did ? G.deals.find(x => x.id===m.did) : null;
  if (m.type==='bp' && d && ['new','meet','dd','ts'].includes(d.state)){ const left = d.close - G.w; return `<span class="dl ${left<=1?'urgent':''}">${left<=0?'本周截止':`剩 ${left} 周`}</span>`; }
  if (!m.done && m.deadline){ const left = m.deadline - G.w; return `<span class="tag warn">${left<=0?'本周':`${left} 周内`}</span>`; }
  if (m.type==='bp' && d) return `<span class="tag ${d.state==='won'?'gain':''}">${{won:'已投',lost:'未投进',passed:'已 Pass'}[d.state]||''}</span>`;
  return '';
}
function vInbox(){
  const list = G.inbox.filter(m => mailMatch(m, ui.mfilter));

      ${!m.attended && !m.skipped && !(m.done && !m.ev) ? `<div class="mact"><button class="btn primary" data-act="board" data-id="attend" ${G.slots<1?'disabled':''}>出席董事会 <span class="cost">1 小时</span></button><button class="btn" data-act="board" data-id="skip">请假</button><span class="muted" style="font-size:12px;align-self:center">出席能加深和创始人的关系，并帮公司一把。</span></div>` : m.attended ? '<div class="resolved">你出席了这次董事会。</div>' : ''}`;
  } else if (m.type==='report' && m.league){

function choiceHtml(m, c){

function dealStatus(d){

  const live = ['new','meet','dd','ts'].includes(d.state);
  return `<div class="callout ${live && left<=1 ? 'loss' : live ? '' : d.state==='won' ? 'gain' : ''}">${st}${live ? ` · 本轮 ${left<=0?'本周':`${left} 周后`}关账 · ${d.offers.length ? `已有 ${d.offers.length} 家机构递了 TS` : '暂时没有别家递 TS'}` : ''}</div>`;

/* ---------- deck viewer ---------- */
function openDeck(id){
  const d = G.deals.find(x => x.id===id) || G.world.find(x => x.id===id); if (!d) return;

  const P = d.pitch ? d.pitch.slides : null;
  const months = Array.from({length:8}, (_,i) => f.mrr / Math.pow(1 + f.growth/100, 7-i));

  const slides = [
    `<div class="slide cover"><div class="bar" style="background:${col}"></div><div class="eyebrow">${STAGES[d.stage].toUpperCase()} · ${fmtYM(G.w)}</div><h1>${esc(d.name)}</h1><p class="lead">${esc(d.tag)}</p>${foot(1)}</div>`,
    `<div class="slide"><div class="eyebrow">01 · 我们看到的问题</div><h2>${esc(P ? P[0].b : d.quote)}</h2><p class="lead">${esc(d.sector)}行业里，这个问题长期没有好的解法。现有方案要么太贵，要么太难用，客户只能将就。</p>${foot(2)}</div>`,
    `<div class="slide"><div class="eyebrow">02 · 我们的方案</div><h2>${esc(P ? P[1].b : d.tag)}</h2><ul><li>产品已上线，客户 NPS ${f.nps}</li><li>${d.k==='ai' ? '自研模型与数据管线' : d.k==='abstract' ? '全新品类，没有直接竞品' : '标准化交付，可快速复制'}</li><li>${f.customers} 家付费客户，复购率持续提升</li></ul>${foot(3)}</div>`,
    `<div class="slide"><div class="eyebrow">03 · 增长</div><h2>月收入 ${f.mrr} 万，月均增长 ${f.growth}%</h2><div class="chartbox">${months.map((v,i) => `<div class="b"><i style="height:${Math.max(4, v/mx*100)}%;background:${col};opacity:${.45+i*.075}"></i>M${i+1}</div>`).join('')}</div>${foot(4)}</div>`,
    `<div class="slide"><div class="eyebrow">04 · 市场</div><h2>可服务市场约 ${f.tam} 亿元</h2><div class="cols"><div><div class="bigk">${f.tam} 亿</div><div class="smk">可服务市场</div></div><div><div class="bigk">${f.customers}</div><div class="smk">付费客户</div></div><div><div class="bigk">${f.runway} 个月</div><div class="smk">现金跑道</div></div></div>${foot(5)}</div>`,
    `<div class="slide"><div class="eyebrow">05 · 团队</div><h2>${esc(d.founder)}，创始人兼 CEO</h2><p class="lead">${esc(d.bio)}。团队共 ${f.team} 人，核心成员来自行业头部公司。</p>${foot(6)}</div>`,
    `<div class="slide"><div class="eyebrow">06 · 本轮融资</div><h2>融资 ${money(d.ask)} · 投前估值 ${money(d.pre)}</h2><div class="cols"><div><div class="bigk">60%</div><div class="smk">产品与研发</div></div><div><div class="bigk">30%</div><div class="smk">市场与销售</div></div><div><div class="bigk">10%</div><div class="smk">运营储备</div></div></div>${foot(7)}</div>`
  ];
  const o = document.createElement('div'); o.className = 'doc-ov'; o.id = 'doc';
  o.innerHTML = `<div class="doc-bar"><span class="pdf" style="width:24px;height:28px;border-radius:2px;background:var(--loss);color:#fff;font-size:8px;font-weight:700;display:grid;place-items:end center;padding-bottom:3px">PDF</span><b>${esc(d.name)}_${STAGES[d.stage].replace(' ','')}_BP.pdf</b><div class="r"><button class="btn sm" data-act="docclose">关闭</button></div></div>${slides.join('')}
    <p style="text-align:center;color:#fff;opacity:.7;font-size:12px">BP 上的数字是创始人自己写的。</p>`;
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  o.addEventListener('click', e => { if (e.target===o || e.target.closest('[data-act=docclose]')){ o.remove(); document.body.style.overflow = ''; } });
}

function lineChart(pts, opts={}){
  const W = 560, H = opts.h || 180, pl = 44, pr = 12, pt = 12, pb = 24;

  const xs = series.flatMap(s => s.pts.map(p => p[0]));

  const X = x => pl + (x-x0)/(x1-x0)*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  const ticks = [y0, (y0+y1)/2, y1].map(v => Math.round(v*10)/10);
  const yrs = []; for (let w = Math.ceil(x0/52)*52; w <= x1; w += 52) yrs.push(w);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'走势图')}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${opts.fmt ? opts.fmt(t) : t}</text>`).join('')}
    ${opts.ref!=null ? `<line x1="${pl}" x2="${W-pr}" y1="${Y(opts.ref)}" y2="${Y(opts.ref)}" stroke="var(--muted)" stroke-dasharray="3 4"/>` : ''}

  </svg>`;
}

}
function confirmDlg(title, body, okLabel, fn){
  const o = dialog(`<div class="dlg-h"><h2>${esc(title)}</h2></div><div class="dlg-b"><p>${esc(body)}</p></div><div class="dlg-f"><button class="btn" data-act="x">取消</button><button class="btn primary" data-act="ok">${esc(okLabel)}</button></div>`);
  o.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; closeDialog(); if (a.dataset.act==='ok') fn(); };
}

/* ---------- actions ---------- */
function act(a, id){
  const d = G && G.deals.find(x => x.id===+id);
  switch (a){
    case 'start': { const bg = (document.querySelector('input[name=bg]:checked')||{}).value || 'industry'; ui.bg = bg; ui.name = ($('#fname').value || '鲸落资本').trim(); G = newGame(bg, ui.name); ui.view = 'inbox'; ui.mail = G.inbox[G.inbox.length-1].id; ui.mfilter = 'all'; save(); $('#app').innerHTML = ''; render(); toast(`${G.name}一期成立`, '$30M 到账。按空格让时间走起来。', 'gain'); break; }
    case 'resume': G = loadSave(); $('#app').innerHTML = ''; render(); break;
    case 'again': G = null; save(); $('#app').innerHTML = ''; render(); break;
    case 'restart': confirmDlg(`放弃${G.name}？`, '这局的进度会被清空，回到开始界面。', '重新开始', () => { setSpeed(0); G = null; save(); $('#app').innerHTML = ''; render(); }); break;
    case 'speed': setSpeed(+id); break;
    case 'nextweek': step(); break;
    case 'autopause': ui.autoPause = !ui.autoPause; try { localStorage.setItem('vc-life-prefs', JSON.stringify({autoPause:ui.autoPause})); } catch(e){} break;
    case 'aiset': openAISettings(); break;
    case 'go': ui.view = id; if (id==='inbox') ui.mail = null; render(); scrollTo(0,0); break;
    case 'mfilter': ui.mfilter = id; render(); break;
    case 'mail': ui.mail = +id; render(); break;
    case 'mailback': ui.mail = null; render(); break;
    case 'deck': openDeck(+id); break;
    case 'opendeal': ui.deal = +id; ui.view = 'deal'; ui.dtab = 'meet'; render(); scrollTo(0,0); break;
    case 'dtab': ui.dtab = id; render(); break;
    case 'meet': if (d && meet(G, d)){ ui.deal = d.id; ui.view = 'deal'; ui.dtab = 'meet'; save(); render(); } else toast('本周时间不够了', '推进到下一周再约'); break;
    case 'dd': if (d && startDD(G, d)){ toast(`${d.name} 尽调已启动`, `${fmtYM(d.ddReady)} 出报告`); save(); render(); } else toast('本周时间不够了', `尽调需要 ${d ? ddCost(G,d) : 3} 小时块`); break;
    case 'ts': if (d) openTS(d.id); break;
    case 'pass': if (d){ passDeal(G, d); toast(`已 Pass ${d.name}`); save(); render(); } break;
    case 'ask': { const dd = G.deals.find(x => x.id===ui.deal); if (dd) askFounder(dd, QUESTIONS[id]); break; }
    case 'reply': { const m = G.inbox.find(x => x.id===ui.mail); const r = m && resolveEmail(G, m, +id); if (r){ toast(r); save(); render(); } else if (m && !m.done) toast('现在做不了', '时间或资金不够'); break; }
    case 'board': { const m = G.inbox.find(x => x.id===ui.mail); const r = m && resolveEmail(G, m, id); if (r){ save(); render(); } else toast('本周时间不够了'); break; }
    case 'portall': ui.portAll = !ui.portAll; render(); break;
    case 'comp': ui.comp = +id; ui.view = 'company'; render(); scrollTo(0,0); break;
    case 'help': { const c = G.port.find(x => x.id===ui.comp); if (!c || c.help >= 3 || c.helpW===G.w || !useSlots(G,1)) break;
      c.help++; c.helpW = G.w; c.rel = Math.min(100, c.rel+4);
      if (id==='hire') c.q = Math.min(.95, c.q+.02);
      if (id==='pr'){ c.val *= 1.06; G.rep = clamp(G.rep+1,0,100); }
      toast({clients:`给 ${c.name} 介绍了三个大客户`, hire:`帮 ${c.name} 挖来一位大厂高管`, pr:`${c.name} 上了财经头条`}[id], '', 'gain'); save(); render(); break; }
    case 'raise': startRaise(G, +id); save(); render(); break;
    case 'lp': { const lp = G.raise && G.raise.lps[+id]; const r = lp && lpMeeting(G, lp); if (r){ if (r.ok) toast(`${lp.name} 承诺出资 ${money(lp.ticket)}`, '', 'gain'); else if (r.no) toast(`${lp.name} 这次没答应`, lp.status==='declined' ? '对方明确拒绝了' : '8 周后可以再约', 'loss'); else toast(r.err); save(); render(); } break; }
    case 'closeraise': if (closeRaise(G)){ toast('新基金关账', '', 'gain'); save(); render(); } break;
    case 'hire': { const c = G.candidates.find(x => x.id===+id); const r = c && hire(G, c); if (r){ toast(r.ok ? `${c.name} 入职` : r.err, '', r.ok ? 'gain' : 'loss'); save(); render(); } break; }
    case 'fire': { const m = G.team.find(x => x.id===+id); if (m) confirmDlg(`辞退 ${m.name}？`, '每周的可用时间会减少。', '辞退', () => { G.team = G.team.filter(x => x !== m); addLog(G, `${m.name} 离开团队`); save(); render(); }); break; }
  }
}
document.addEventListener('click', e => {
  if (e.target.closest('#ov, #doc')) return;
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  if (a.type==='checkbox'){ act(a.dataset.act, a.dataset.id); return; }
  if (a.tagName==='INPUT' && a.type==='radio') return;
  act(a.dataset.act, a.dataset.id);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'askform') return;
  e.preventDefault();
  const box = $('#qbox'), d = G && G.deals.find(x => x.id===ui.deal);
  if (d && box.value.trim()){ const t = box.value; box.value = ''; box.blur(); askFounder(d, t); }
});
document.addEventListener('keydown', e => {
  if (!G || G.over || e.code !== 'Space' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('#ov') || $('#doc')) return;
  e.preventDefault(); if (document.activeElement.tagName==='BUTTON') document.activeElement.blur(); setSpeed(ui.speed ? 0 : (ui.lastSpeed || 1));
});
window.claude?.use?.('sample')?.then(s => { AI.sample = s || null; if (G) renderChrome(); }, () => {});

function boot(data){
  if (data && data.G) G = data.G;
  render();
}
window.claude?.hot?.snapshot?.(() => ({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
